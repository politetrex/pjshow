<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome · 节拍器</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/s1.css">

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#93c5fd',
                        accent: '#1d4ed8',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#94a3b8'
                    },
                    fontFamily: { sans: ['Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .s1-play-btn {
            width: 6rem; height: 6rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 700;
            transition: all 0.2s; border: none; cursor: pointer;
            color: #ffffff;
        }
        .s1-play-btn.playing { background: #22c55e; box-shadow: 0 0 25px rgba(34,197,94,0.5); }
        .s1-play-btn.stopped { background: var(--s1-primary); box-shadow: 0 0 25px rgba(59,130,246,0.4); }
        .s1-play-btn:active { transform: scale(0.96); }
        .s1-tap-btn {
            width: 6rem; height: 6rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 600;
            background: var(--s1-neutral); color: var(--s1-text);
            border: none; cursor: pointer; transition: all 0.1s;
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .dark .s1-tap-btn { background: #334155; color: #f1f5f9; }
        .s1-tap-btn:active { background: var(--s1-primary); color: #fff; transform: scale(0.96); }
        .s1-preset-btn {
            padding: 0.5rem 1rem; border-radius: 0.5rem;
            background: var(--s1-neutral); color: var(--s1-text);
            border: none; cursor: pointer; font-size: 0.875rem;
            font-weight: 500; transition: background 0.15s;
        }
        .dark .s1-preset-btn { background: #334155; color: #f1f5f9; }
        .s1-preset-btn:hover { background: var(--s1-primary); color: #ffffff; }
        .s1-range {
            -webkit-appearance: none; width: 100%; height: 8px;
            background: var(--s1-border); border-radius: 10px; outline: none; cursor: pointer;
        }
        .s1-range::-webkit-slider-thumb {
            -webkit-appearance: none; width: 26px; height: 26px;
            background: var(--s1-primary); border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: grab;
        }
        .s1-range::-moz-range-thumb {
            width: 26px; height: 26px; background: var(--s1-primary);
            border: none; border-radius: 50%; cursor: grab;
        }
        .s1-beat-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; display: inline-block;
            transition: background 0.1s, box-shadow 0.1s;
        }
        .s1-beat-dot.flash { background: #ffffff; box-shadow: 0 0 12px #ffffff; }
        .s1-lang-btn {
            padding: 0.4rem 1rem; border-radius: 0.5rem;
            background: transparent; color: var(--s1-text-dim);
            border: none; cursor: pointer; font-size: 0.875rem;
            font-weight: 500; transition: all 0.15s;
        }
        .s1-lang-btn.active { background: var(--s1-primary); color: #ffffff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="s1-card w-full max-w-xl">
        <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
            <h1 class="text-2xl font-bold text-accent dark:text-blue-300 flex items-center gap-2">
                ⏱️ <span id="appTitle">Metronome</span>
            </h1>
            <div class="flex items-center gap-3">
                <div class="flex bg-slate-100 dark:bg-slate-700 rounded-lg p-0.5" role="group">
                    <button class="s1-lang-btn active" data-lang="en" id="langEn">EN</button>
                    <button class="s1-lang-btn" data-lang="zh" id="langZh">中文</button>
                </div>
                <button class="s1-btn s1-btn-secondary text-sm px-3 py-1.5" id="themeToggle" title="切换明暗模式">
                    <i id="themeIcon" class="fa fa-moon-o"></i>
                </button>
            </div>
        </div>

        <div class="text-center mb-8">
            <div class="text-7xl font-bold tabular-nums tracking-tight" id="bpmDisplay">120</div>
            <div class="text-sm text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-1" id="bpmUnit">BPM</div>
        </div>

        <div class="mb-8">
            <input type="range" id="bpmSlider" min="30" max="240" value="120" step="1" class="s1-range">
            <div class="flex justify-between text-xs text-slate-400 dark:text-slate-500 mt-1">
                <span>30</span>
                <span>240</span>
            </div>
        </div>

        <div class="flex justify-center items-center gap-6 mb-8">
            <button class="s1-play-btn stopped" id="playBtn" aria-label="Play / Stop">▶</button>
            <button class="s1-tap-btn" id="tapBtn" aria-label="Tap tempo">TAP</button>
        </div>

        <div class="flex justify-center gap-3 flex-wrap mb-6">
            <button class="s1-preset-btn" data-bpm="60">60</button>
            <button class="s1-preset-btn" data-bpm="80">80</button>
            <button class="s1-preset-btn" data-bpm="100">100</button>
            <button class="s1-preset-btn" data-bpm="120">120</button>
            <button class="s1-preset-btn" data-bpm="140">140</button>
            <button class="s1-preset-btn" data-bpm="180">180</button>
        </div>

        <div class="flex justify-center items-center gap-6 text-sm text-slate-500 dark:text-slate-400 border-t border-gray-200 dark:border-slate-700 pt-4">
            <span class="flex items-center gap-2">
                <span class="s1-beat-dot" id="beatDot"></span>
                <span id="statusText">stopped</span>
            </span>
            <span id="langIndicator">EN</span>
        </div>
    </div>

<script>
(function(){
    let audioCtx = null;
    let isPlaying = false;
    let bpm = 120;
    let currentLang = 'en';
    let nextNoteTime = 0;
    let timerID = null;
    const lookahead = 25;
    const scheduleAheadTime = 0.1;
    let tapTimes = [];
    const TAP_TIMEOUT = 2500;

    const bpmDisplay = document.getElementById('bpmDisplay');
    const bpmUnit = document.getElementById('bpmUnit');
    const bpmSlider = document.getElementById('bpmSlider');
    const playBtn = document.getElementById('playBtn');
    const tapBtn = document.getElementById('tapBtn');
    const beatDot = document.getElementById('beatDot');
    const statusText = document.getElementById('statusText');
    const appTitle = document.getElementById('appTitle');
    const langEn = document.getElementById('langEn');
    const langZh = document.getElementById('langZh');
    const langIndicator = document.getElementById('langIndicator');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    const i18n = {
        en: { title: 'Metronome', bpmUnit: 'BPM', statusStopped: 'stopped', statusPlaying: 'playing', tap: 'TAP', play: '▶', stop: '■', langIndicator: 'EN' },
        zh: { title: '节拍器', bpmUnit: '拍/分钟', statusStopped: '已停止', statusPlaying: '播放中', tap: '点击', play: '▶', stop: '■', langIndicator: '中文' }
    };

    function initThemeIcon() {
        const isDark = document.documentElement.classList.contains('dark');
        themeIcon.className = isDark ? 'fa fa-sun-o' : 'fa fa-moon-o';
    }
    themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        initThemeIcon();
    });
    initThemeIcon();

    function updateLanguage(lang) {
        currentLang = lang;
        const t = i18n[lang];
        appTitle.textContent = t.title;
        bpmUnit.textContent = t.bpmUnit;
        tapBtn.textContent = t.tap;
        statusText.textContent = isPlaying ? t.statusPlaying : t.statusStopped;
        langIndicator.textContent = t.langIndicator;
        playBtn.textContent = isPlaying ? '■' : '▶';
        if (lang === 'en') { langEn.classList.add('active'); langZh.classList.remove('active'); }
        else { langZh.classList.add('active'); langEn.classList.remove('active'); }
    }

    function setBpm(newBpm, updateSlider = true) {
        bpm = Math.min(240, Math.max(30, Math.round(newBpm)));
        bpmDisplay.textContent = bpm;
        if (updateSlider) bpmSlider.value = bpm;
    }

    function flashBeat() {
        beatDot.classList.add('flash');
        setTimeout(() => beatDot.classList.remove('flash'), 70);
    }

    function playClick(time) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 1200;
        gainNode.gain.setValueAtTime(0.5, time);
        gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.06);
    }

    function scheduler() {
        if (!isPlaying) return;
        while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
            playClick(nextNoteTime);
            const delay = (nextNoteTime - audioCtx.currentTime) * 1000;
            if (delay >= 0) setTimeout(() => { if (isPlaying) flashBeat(); }, Math.max(0, delay));
            nextNoteTime += 60.0 / bpm;
        }
        timerID = setTimeout(scheduler, lookahead);
    }

    function startMetronome() {
        if (isPlaying) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume().then(() => {
            isPlaying = true;
            nextNoteTime = audioCtx.currentTime + 0.05;
            playBtn.textContent = '■';
            playBtn.classList.remove('stopped');
            playBtn.classList.add('playing');
            statusText.textContent = i18n[currentLang].statusPlaying;
            scheduler();
        }).catch(err => console.warn('AudioContext resume error:', err));
    }

    function stopMetronome() {
        if (!isPlaying) return;
        isPlaying = false;
        if (timerID) { clearTimeout(timerID); timerID = null; }
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        playBtn.classList.add('stopped');
        statusText.textContent = i18n[currentLang].statusStopped;
        beatDot.classList.remove('flash');
    }

    function togglePlay() { if (isPlaying) stopMetronome(); else startMetronome(); }

    function handleTap() {
        const now = performance.now();
        tapTimes = tapTimes.filter(t => now - t < TAP_TIMEOUT);
        tapTimes.push(now);
        if (tapTimes.length >= 2) {
            const intervals = [];
            for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
            const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
            if (avgInterval > 0) setBpm(Math.min(240, Math.max(30, Math.round(60000 / avgInterval))), true);
        }
        beatDot.classList.add('flash');
        setTimeout(() => beatDot.classList.remove('flash'), 80);
    }

    playBtn.addEventListener('click', togglePlay);
    bpmSlider.addEventListener('input', (e) => setBpm(parseInt(e.target.value, 10), false));
    document.querySelectorAll('.s1-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => setBpm(parseInt(btn.getAttribute('data-bpm'), 10), true));
    });
    tapBtn.addEventListener('click', handleTap);
    langEn.addEventListener('click', () => updateLanguage('en'));
    langZh.addEventListener('click', () => updateLanguage('zh'));

    setBpm(120, true);
    updateLanguage('en');
    window.addEventListener('beforeunload', () => { if (isPlaying) stopMetronome(); });
})();
</script>
</body>
</html>
