<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link href="./src/main.css" rel="stylesheet">
        <title>The Online Encyclopedia of Twenty-four Dots (OETD)</title>
    </head>
    <body>
        <div id="app">
            <header>
                <img src="./src/banner.png" alt="OETD Banner">
                <nav id="nav-bar">
                    <a href="./index.html" data-i18n="navHome">Home</a>
                    <a href="./rank.html" data-i18n="navRank">Ranking</a>
                    <button id="lang-btn" class="lang-toggle">EN / 中文</button>
                </nav>
            </header>
            
            <main>
                <h1 data-i18n="title">24 Point Solver</h1>
                <p data-i18n="subtitle">Enter four numbers (1–13) to find all ways to make 24.</p>
                
                <div class="input-row">
                    <input type="number" id="a" min="1" max="13">
                    <input type="number" id="b" min="1" max="13">
                    <input type="number" id="c" min="1" max="13">
                    <input type="number" id="d" min="1" max="13">
                    <button id="query-btn" data-i18n="solveBtn">Solve</button>
                    <span id="status"></span>
                </div>
                
                <div id="result"></div>
                <div id="pagination"></div>
            </main>
            
            <footer>
                <p data-i18n="footer">Data: 1820 combinations, 114573 solutions</p>
            </footer>
        </div>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
