<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四年级下册数学每日练习</title>

    <link rel="icon" href="../src/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../src/favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
    <link rel="stylesheet" href="../src/css/s1.css">

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#93c5fd',
                        accent: '#1d4ed8',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#94a3b8'
                    },
                    fontFamily: { sans: ['Arial', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="mb-4 s1-header-container flex items-center justify-between">
            <div class="s1-header-main">
                <h1 class="text-3xl font-bold text-accent dark:text-blue-300 mb-2">四年级下册数学每日练习</h1>
                <p class="text-slate-600 dark:text-slate-400">
                    <b><img src="../src/favicon.png" class="inline w-5 h-auto"> 林耀爱学习（主站附属应用）</b>
                    · 人教版 · 四则运算 · 运算定律 · 小数计算
                </p>
            </div>
            <div class="s1-print-info hidden">
                <div><i class="fa fa-calendar mr-1"></i><span id="print-date"></span></div>
                <div><i class="fa fa-random mr-1"></i>种子: <span id="print-seed"></span></div>
            </div>
        </header>

        <div class="s1-card mb-6 s1-no-print">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center">
                    <i class="fa fa-calendar text-primary mr-2"></i>
                    <span id="current-date" class="text-lg font-medium"></span>
                </div>
                <div class="flex flex-wrap items-center justify-center gap-4">
                    <div class="flex items-center">
                        <i class="fa fa-random text-primary mr-2"></i>
                        <span class="text-lg font-medium">种子: </span>
                        <input type="number" id="seed-input" class="ml-1 text-lg font-medium font-mono border border-gray-300 dark:border-slate-600 rounded px-2 py-1 w-32 text-center dark:bg-slate-700 dark:text-slate-100">
                    </div>
                    <div class="flex space-x-2 flex-wrap">
                        <button id="generate-btn" class="s1-btn s1-btn-primary">
                            <i class="fa fa-refresh mr-2"></i>重新生成
                        </button>
                        <button id="show-answer-btn" class="s1-btn s1-btn-success">
                            <i class="fa fa-check-circle mr-2"></i>显示答案
                        </button>
                        <button id="print-btn" class="s1-btn s1-btn-secondary">
                            <i class="fa fa-print mr-2"></i>打印练习
                        </button>
                        <button id="themeToggle" class="s1-btn s1-btn-secondary" title="切换明暗模式">
                            <i id="themeIcon" class="fa fa-moon-o"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="s1-card md:col-span-2">
                <h2 class="s1-title"><i class="fa fa-calculator"></i>一、口算题（10道）</h2>
                <div id="oral-problems" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3"></div>
            </div>
            <div class="s1-card">
                <h2 class="s1-title"><i class="fa fa-pencil"></i>二、竖式计算（3道，需验算）</h2>
                <div id="vertical-problems" class="space-y-6"></div>
            </div>
            <div class="s1-card">
                <h2 class="s1-title"><i class="fa fa-magic"></i>三、简便计算/脱式计算（6道）</h2>
                <div id="simplified-problems" class="space-y-4"></div>
            </div>
        </div>

        <div id="answer-section" class="s1-card mb-8 hidden">
            <h2 class="s1-title"><i class="fa fa-check-square-o"></i>参考答案</h2>
            <div id="answers-container"></div>
        </div>

        <footer class="mt-8"></footer>
        <script src="../src/js/copyright-parse.js" type="module"></script>
    </div>

<script>
// ============================================================
//  四年级数学练习核心逻辑（保留全部功能）
// ============================================================
let currentSeed = 0;
let allAnswers = { oral: [], vertical: [], simplified: [] };

const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
function initThemeIcon() {
    const isDark = document.documentElement.classList.contains('dark');
    themeIcon.className = isDark ? 'fa fa-sun-o' : 'fa fa-moon-o';
}
themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeIcon();
});
initThemeIcon();

document.addEventListener('DOMContentLoaded', function() {
    setCurrentDateAndSeed();
    generateAllProblems();
    document.getElementById('generate-btn').addEventListener('click', generateNewRandomSeed);
    document.getElementById('show-answer-btn').addEventListener('click', toggleAnswers);
    document.getElementById('print-btn').addEventListener('click', printProblems);
    document.getElementById('seed-input').addEventListener('change', generateProblemsFromInput);
});

function getTodaySeed() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor(today.getTime() / 1000);
}
function getTomorrowSeed() {
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    return Math.floor(tomorrow.getTime() / 1000);
}
function setCurrentDateAndSeed() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    currentSeed = getTodaySeed();
    const formattedDate = formatDate(today);
    document.getElementById('current-date').textContent = formattedDate;
    document.getElementById('seed-input').value = currentSeed;
    document.getElementById('print-date').textContent = formattedDate;
    document.getElementById('print-seed').textContent = currentSeed;
}
function formatDate(date) {
    return `${date.getFullYear()}年${String(date.getMonth() + 1).padStart(2, '0')}月${String(date.getDate()).padStart(2, '0')}日`;
}
function generateProblemsFromInput() {
    const seedInput = document.getElementById('seed-input');
    const newSeed = parseInt(seedInput.value);
    if (!isNaN(newSeed)) {
        currentSeed = newSeed;
        generateAllProblems();
        document.getElementById('answer-section').classList.add('hidden');
        document.getElementById('print-seed').textContent = currentSeed;
    } else {
        alert('请输入有效的种子数值！');
        seedInput.value = currentSeed;
    }
}
function generateNewRandomSeed() {
    try {
        const todaySeed = getTodaySeed(), tomorrowSeed = getTomorrowSeed();
        const seedInput = document.getElementById('seed-input');
        const inputSeed = parseInt(seedInput.value);
        if (inputSeed < todaySeed || inputSeed >= tomorrowSeed) currentSeed = todaySeed;
        else {
            currentSeed = currentSeed + 1;
            if (currentSeed >= tomorrowSeed) currentSeed = todaySeed;
        }
        document.getElementById('seed-input').value = currentSeed;
        document.getElementById('print-seed').textContent = currentSeed;
        generateAllProblems();
        document.getElementById('answer-section').classList.add('hidden');
    } catch (error) {
        console.error('重新生成按钮出错:', error);
        alert('重新生成时出错，请刷新页面重试');
    }
}
function toggleAnswers() {
    const answerSection = document.getElementById('answer-section');
    const showAnswerBtn = document.getElementById('show-answer-btn');
    if (answerSection.classList.contains('hidden')) {
        answerSection.classList.remove('hidden');
        showAnswerBtn.innerHTML = '<i class="fa fa-eye-slash mr-2"></i>隐藏答案';
        displayAllAnswers();
    } else {
        answerSection.classList.add('hidden');
        showAnswerBtn.innerHTML = '<i class="fa fa-check-circle mr-2"></i>显示答案';
    }
}
function displayAllAnswers() {
    const answersContainer = document.getElementById('answers-container');
    answersContainer.innerHTML = '';

    const oralAnswersDiv = document.createElement('div');
    oralAnswersDiv.className = 'mb-6';
    oralAnswersDiv.innerHTML = `<h3 class="text-lg font-bold text-accent dark:text-blue-300 mb-3">一、口算题答案</h3><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3" id="oral-answers"></div>`;
    answersContainer.appendChild(oralAnswersDiv);
    const oralAnswersContainer = document.getElementById('oral-answers');
    allAnswers.oral.forEach((answer, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem s1-answer flex items-center justify-between';
        el.innerHTML = `<span class="font-medium">${index + 1}. </span><span>${answer}</span>`;
        oralAnswersContainer.appendChild(el);
    });

    const verticalAnswersDiv = document.createElement('div');
    verticalAnswersDiv.className = 'mb-6';
    verticalAnswersDiv.innerHTML = `<h3 class="text-lg font-bold text-accent dark:text-blue-300 mb-3">二、竖式计算题答案（含验算）</h3><div class="space-y-6" id="vertical-answers"></div>`;
    answersContainer.appendChild(verticalAnswersDiv);
    const verticalAnswersContainer = document.getElementById('vertical-answers');
    allAnswers.vertical.forEach((answer, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem s1-answer';
        const [num1, operator, num2] = answer.problem.split(' ');
        const result = answer.result;
        let verticalHTML = `
            <div class="mb-2">${index + 1}. ${answer.problem} = ${result}</div>
            <div class="flex items-start w-full mb-4">
                <div class="flex flex-col items-end w-[45%]">
                    <div class="text-right text-lg">${num1.toString().padStart(12)}</div>
                    <div class="flex items-center justify-end text-lg">
                        <span class="mr-2 font-medium">${operator}</span>
                        <span>${num2.toString().padStart(11)}</span>
                    </div>
                    <div class="border-b-2 border-black w-36 mt-1"></div>
                    <div class="text-right text-lg font-bold mt-1">${result.toString().padStart(12)}</div>
                </div>
                <div class="flex items-center px-4 text-center whitespace-nowrap">
                    <div class="text-base font-medium">验算：</div>
                </div>
                <div class="flex flex-col items-end w-[45%]">
        `;
        if (operator === '+') {
            verticalHTML += `
                <div class="text-right text-lg">${num2.toString().padStart(12)}</div>
                <div class="flex items-center justify-end text-lg">
                    <span class="mr-2 font-medium">+</span>
                    <span>${num1.toString().padStart(11)}</span>
                </div>
                <div class="border-b-2 border-black w-36 mt-1"></div>
                <div class="text-right text-lg font-bold mt-1">${result.toString().padStart(12)}</div>
            `;
        } else if (operator === '-') {
            verticalHTML += `
                <div class="text-right text-lg">${result.toString().padStart(12)}</div>
                <div class="flex items-center justify-end text-lg">
                    <span class="mr-2 font-medium">+</span>
                    <span>${num2.toString().padStart(11)}</span>
                </div>
                <div class="border-b-2 border-black w-36 mt-1"></div>
                <div class="text-right text-lg font-bold mt-1">${num1.toString().padStart(12)}</div>
            `;
        }
        verticalHTML += `</div></div>`;
        el.innerHTML = verticalHTML;
        verticalAnswersContainer.appendChild(el);
    });

    const simplifiedAnswersDiv = document.createElement('div');
    simplifiedAnswersDiv.className = 'mb-6';
    simplifiedAnswersDiv.innerHTML = `<h3 class="text-lg font-bold text-accent dark:text-blue-300 mb-3">三、简便计算/脱式计算题答案</h3><div class="space-y-4" id="simplified-answers"></div>`;
    answersContainer.appendChild(simplifiedAnswersDiv);
    const simplifiedAnswersContainer = document.getElementById('simplified-answers');
    allAnswers.simplified.forEach((answer, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem s1-answer';
        el.innerHTML = `
            <div class="flex items-start">
                <span class="font-medium mr-2">${index + 1}.</span>
                <div class="flex-1">
                    <div>${answer.problem} = ${answer.result}</div>
                    <div class="mt-2 text-sm text-green-700 dark:text-green-300">${answer.steps || ''}</div>
                </div>
            </div>
        `;
        simplifiedAnswersContainer.appendChild(el);
    });
}

function generateAllProblems() {
    Math.seedrandom(currentSeed.toString());
    generateOralProblems();
    generateVerticalProblems();
    generateSimplifiedProblems();
}

function ensureDecimal(num) { return Number.isInteger(num) ? num + 0.01 : num; }

function formatDecimal(num) {
    if (typeof num === 'string') num = parseFloat(num);
    const rounded = Math.round(num * 100) / 100;
    if (Number.isInteger(rounded)) return rounded.toFixed(1);
    return rounded.toFixed(2).replace(/\.?0+$/, '');
}

function generateOralProblems() {
    const container = document.getElementById('oral-problems');
    container.innerHTML = '';
    allAnswers.oral = [];
    const oralProblems = [];
    for (let i = 0; i < 10; i++) {
        const types = ['addition', 'subtraction'];
        const type = types[Math.floor(Math.random() * types.length)];
        let num1, num2, result;
        switch (type) {
            case 'addition':
                num1 = ensureDecimal(Math.floor(Math.random() * 100) + (Math.floor(Math.random() * 99) + 1) / 100);
                num2 = ensureDecimal(Math.floor(Math.random() * 100) + (Math.floor(Math.random() * 99) + 1) / 100);
                result = num1 + num2;
                break;
            case 'subtraction':
                num1 = ensureDecimal(Math.floor(Math.random() * 100) + (Math.floor(Math.random() * 99) + 1) / 100);
                num2 = ensureDecimal((Math.floor(Math.random() * Math.floor((num1 - 0.01) * 100)) / 100) + (Math.floor(Math.random() * 99) + 1) / 100);
                result = num1 - num2;
                break;
        }
        oralProblems.push({ problem: `${formatDecimal(num1)} ${type === 'addition' ? '+' : '-'} ${formatDecimal(num2)} =`, result: formatDecimal(result) });
    }
    oralProblems.forEach((problem, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem flex items-center justify-between';
        el.innerHTML = `<span class="font-medium">${index + 1}. ${problem.problem}</span><span class="w-16 h-6 bg-white dark:bg-slate-600 border border-gray-300 dark:border-slate-500 rounded"></span>`;
        container.appendChild(el);
        allAnswers.oral.push(problem.result);
    });
}

function generateVerticalProblems() {
    const container = document.getElementById('vertical-problems');
    container.innerHTML = '';
    allAnswers.vertical = [];
    const verticalProblems = [];
    for (let i = 0; i < 3; i++) {
        const type = Math.random() < 0.5 ? 'addition' : 'subtraction';
        if (type === 'addition') {
            const num1 = ensureDecimal(Math.floor(Math.random() * 90) + (Math.floor(Math.random() * 99) + 1) / 100);
            const num2 = ensureDecimal(Math.floor(Math.random() * 90) + (Math.floor(Math.random() * 99) + 1) / 100);
            const result = num1 + num2;
            verticalProblems.push({ type: 'addition', num1: formatDecimal(num1), num2: formatDecimal(num2), result: formatDecimal(result) });
        } else {
            const num1 = ensureDecimal(Math.floor(Math.random() * 90) + (Math.floor(Math.random() * 99) + 1) / 100);
            const num2 = ensureDecimal((Math.floor(Math.random() * Math.floor((num1 - 0.01) * 100)) / 100) + (Math.floor(Math.random() * 99) + 1) / 100);
            const result = num1 - num2;
            verticalProblems.push({ type: 'subtraction', num1: formatDecimal(num1), num2: formatDecimal(num2), result: formatDecimal(result) });
        }
    }
    verticalProblems.forEach((problem, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem';
        el.innerHTML = `
            <div class="mb-1">${index + 1}.</div>
            <div class="flex items-start w-full">
                <div class="flex flex-col items-end w-[45%]">
                    <div class="text-right text-lg">${problem.num1.toString().padStart(12)}</div>
                    <div class="flex items-center justify-end text-lg">
                        <span class="mr-2 font-medium">${problem.type === 'addition' ? '+' : '-'}</span>
                        <span>${problem.num2.toString().padStart(11)}</span>
                    </div>
                    <div class="border-b-2 border-black w-36 mt-1"></div>
                    <div class="h-32 w-36 border-b border-r border-l border-gray-300 mt-1"></div>
                </div>
                <div class="flex items-center px-4 text-center whitespace-nowrap">
                    <div class="text-base font-medium">验算：</div>
                </div>
                <div class="flex flex-col items-end w-[45%]"><div class="h-24 w-36"></div></div>
            </div>
        `;
        container.appendChild(el);
        allAnswers.vertical.push({ problem: `${problem.num1} ${problem.type === 'addition' ? '+' : '-'} ${problem.num2}`, result: problem.result });
    });
}

const simplifiedTemplates = [
    () => {
        const intPart = Math.floor(Math.random() * 40) + 10;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart + decimalPart;
        const d3 = formatDecimal(10 - decimalPart);
        const d2 = formatDecimal(Math.floor(Math.random() * 30) + 5 + (Math.floor(Math.random() * 99) + 1) / 100);
        const problem = `${formatDecimal(d1)} + ${formatDecimal(d2)} + ${formatDecimal(d3)}`;
        const result = d1 + parseFloat(d2) + parseFloat(d3);
        const steps = `= (${formatDecimal(d1)} + ${formatDecimal(d3)}) + ${formatDecimal(d2)} = ${intPart + 10} + ${formatDecimal(d2)} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart = Math.floor(Math.random() * 40) + 15;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart + decimalPart;
        const d3 = (intPart - 10) + decimalPart;
        const d2 = formatDecimal(Math.floor(Math.random() * 25) + 8 + (Math.floor(Math.random() * 99) + 1) / 100);
        const problem = `${formatDecimal(d1)} + ${formatDecimal(d2)} - ${formatDecimal(d3)}`;
        const result = d1 + parseFloat(d2) - parseFloat(d3);
        const steps = `= (${formatDecimal(d1)} - ${formatDecimal(d3)}) + ${formatDecimal(d2)} = ${10} + ${formatDecimal(d2)} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart = Math.floor(Math.random() * 35) + 12;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart + decimalPart;
        const d3 = formatDecimal(15 - decimalPart);
        const d2 = formatDecimal(Math.floor(Math.random() * 20) + 6 + (Math.floor(Math.random() * 99) + 1) / 100);
        const problem = `${formatDecimal(d1)} - ${formatDecimal(d2)} + ${formatDecimal(d3)}`;
        const result = d1 - parseFloat(d2) + parseFloat(d3);
        const steps = `= (${formatDecimal(d1)} + ${formatDecimal(d3)}) - ${formatDecimal(d2)} = ${intPart + 15} - ${formatDecimal(d2)} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart = Math.floor(Math.random() * 45) + 18;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart + decimalPart;
        const d3 = formatDecimal((intPart - 8) + decimalPart);
        const d2 = formatDecimal(Math.floor(Math.random() * 22) + 7 + (Math.floor(Math.random() * 99) + 1) / 100);
        const problem = `${formatDecimal(d1)} - (${formatDecimal(d2)} + ${formatDecimal(d3)})`;
        const result = d1 - (parseFloat(d2) + parseFloat(d3));
        const steps = `= ${formatDecimal(d1)} - ${formatDecimal(d3)} - ${formatDecimal(d2)} = ${8} - ${formatDecimal(d2)} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart = Math.floor(Math.random() * 30) + 25;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d2 = intPart - 12 + decimalPart;
        const d3 = formatDecimal(12 - decimalPart);
        const d1 = formatDecimal(Math.floor(Math.random() * 50) + 30 + (Math.floor(Math.random() * 99) + 1) / 100);
        const problem = `${formatDecimal(d1)} - ${formatDecimal(d2)} - ${formatDecimal(d3)}`;
        const result = parseFloat(d1) - d2 - parseFloat(d3);
        const steps = `= ${formatDecimal(d1)} - (${formatDecimal(d2)} + ${formatDecimal(d3)}) = ${formatDecimal(d1)} - ${intPart} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart = Math.floor(Math.random() * 38) + 14;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart + decimalPart;
        const d3 = formatDecimal(12 - decimalPart);
        const d2 = formatDecimal(Math.floor(Math.random() * 28) + 10 + (Math.floor(Math.random() * 99) + 1) / 100);
        const problem = `${formatDecimal(d1)} - (${formatDecimal(d2)} - ${formatDecimal(d3)})`;
        const result = d1 - (parseFloat(d2) - parseFloat(d3));
        const steps = `= ${formatDecimal(d1)} + ${formatDecimal(d3)} - ${formatDecimal(d2)} = ${intPart + 12} - ${formatDecimal(d2)} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart1 = Math.floor(Math.random() * 25) + 10;
        const intPart2 = Math.floor(Math.random() * 20) + 8;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = ensureDecimal(intPart1 + decimalPart);
        const d3 = formatDecimal(10 - decimalPart);
        const d2 = formatDecimal(intPart2 + (0.99 - decimalPart));
        const d4 = formatDecimal(10 - (0.99 - decimalPart));
        const problem = `${formatDecimal(d1)} + ${formatDecimal(d2)} + ${formatDecimal(d3)} + ${formatDecimal(d4)}`;
        const result = d1 + parseFloat(d2) + parseFloat(d3) + parseFloat(d4);
        const steps = `= (${formatDecimal(d1)} + ${formatDecimal(d3)}) + (${formatDecimal(d2)} + ${formatDecimal(d4)}) = ${intPart1 + 10} + ${intPart2 + 10} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart1 = Math.floor(Math.random() * 25) + 12;
        const intPart2 = Math.floor(Math.random() * 20) + 15;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart1 + decimalPart;
        const d4 = formatDecimal(15 - decimalPart);
        const d2 = formatDecimal(intPart2 + (0.99 - decimalPart));
        const d3 = formatDecimal(10 - (0.99 - decimalPart));
        const problem = `${formatDecimal(d1)} - ${formatDecimal(d2)} - ${formatDecimal(d3)} + ${formatDecimal(d4)}`;
        const result = d1 - parseFloat(d2) - parseFloat(d3) + parseFloat(d4);
        const steps = `= (${formatDecimal(d1)} + ${formatDecimal(d4)}) - (${formatDecimal(d2)} + ${formatDecimal(d3)}) = ${intPart1 + 15} - ${intPart2 + 10} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart1 = Math.floor(Math.random() * 30) + 15;
        const intPart2 = Math.floor(Math.random() * 20) + 10;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart1 + decimalPart;
        const d4 = formatDecimal(12 - decimalPart);
        const d2 = intPart2 + decimalPart;
        const d3 = formatDecimal((intPart2 - 5) + decimalPart);
        const problem = `${formatDecimal(d1)} - (${formatDecimal(d2)} - ${formatDecimal(d3)}) + ${formatDecimal(d4)}`;
        const result = d1 - (parseFloat(d2) - parseFloat(d3)) + parseFloat(d4);
        const steps = `= ${formatDecimal(d1)} - ${5} + ${formatDecimal(d4)} = (${formatDecimal(d1)} + ${formatDecimal(d4)}) - 5 = ${intPart1 + 12} - 5 = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart1 = Math.floor(Math.random() * 28) + 13;
        const intPart2 = Math.floor(Math.random() * 20) + 12;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart1 + decimalPart;
        const d3 = formatDecimal(11 - decimalPart);
        const d2 = formatDecimal(intPart2 + (0.99 - decimalPart));
        const d4 = formatDecimal(10 - (0.99 - decimalPart));
        const problem = `${formatDecimal(d1)} - [${formatDecimal(d2)} - (${formatDecimal(d3)} - ${formatDecimal(d4)})]`;
        const result = d1 - (parseFloat(d2) - (parseFloat(d3) - parseFloat(d4)));
        const steps = `= ${formatDecimal(d1)} - [${formatDecimal(d2)} - ${formatDecimal(d3 - d4)}] = ${formatDecimal(d1)} - ${formatDecimal(d2 - (d3 - d4))} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart1 = Math.floor(Math.random() * 35) + 20;
        const intPart2 = Math.floor(Math.random() * 15) + 10;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart1 + decimalPart;
        const d3 = (intPart1 - 8) + decimalPart;
        const d2 = intPart2 + decimalPart;
        const d4 = (intPart2 - 3) + decimalPart;
        const problem = `(${formatDecimal(d1)} - ${formatDecimal(d2)}) - (${formatDecimal(d3)} - ${formatDecimal(d4)})`;
        const result = (d1 - parseFloat(d2)) - (parseFloat(d3) - parseFloat(d4));
        const steps = `= (${formatDecimal(d1)} - ${formatDecimal(d3)}) - (${formatDecimal(d2)} - ${formatDecimal(d4)}) = ${8} - ${3} = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    },
    () => {
        const intPart1 = Math.floor(Math.random() * 32) + 16;
        const intPart2 = Math.floor(Math.random() * 22) + 14;
        const decimalPart = (Math.floor(Math.random() * 99) + 1) / 100;
        const d1 = intPart1 + decimalPart;
        const d2 = intPart2 + decimalPart;
        const d3 = formatDecimal((intPart2 - 6) + decimalPart);
        const d4 = formatDecimal(10 - decimalPart);
        const problem = `[${formatDecimal(d1)} - (${formatDecimal(d2)} - ${formatDecimal(d3)})] + ${formatDecimal(d4)}`;
        const result = (d1 - (parseFloat(d2) - parseFloat(d3))) + parseFloat(d4);
        const steps = `= [${formatDecimal(d1)} - ${6}] + ${formatDecimal(d4)} = (${formatDecimal(d1 - 6)} + ${formatDecimal(d4)}) = ${formatDecimal(result)}`;
        return { problem, result: formatDecimal(result), steps };
    }
];

function generateSimplifiedProblems() {
    const container = document.getElementById('simplified-problems');
    container.innerHTML = '';
    allAnswers.simplified = [];
    const simplifiedIndices = [];
    while (simplifiedIndices.length < 3) {
        const index = Math.floor(Math.random() * simplifiedTemplates.length);
        if (!simplifiedIndices.includes(index)) simplifiedIndices.push(index);
    }
    const simplifiedProblems = simplifiedIndices.map(index => simplifiedTemplates[index]());
    const regularProblems = [];
    for (let i = 0; i < 3; i++) {
        const numOperations = Math.floor(Math.random() * 2) + 2;
        let problem = '', result = 0;
        if (numOperations === 2) {
            const num1 = ensureDecimal(Math.floor(Math.random() * 100) + (Math.floor(Math.random() * 99) + 1) / 100);
            const num2 = ensureDecimal(Math.floor(Math.random() * 50) + (Math.floor(Math.random() * 99) + 1) / 100);
            const num3 = ensureDecimal(Math.floor(Math.random() * 30) + (Math.floor(Math.random() * 99) + 1) / 100);
            const op1 = Math.random() < 0.5 ? '+' : '-';
            const op2 = Math.random() < 0.5 ? '+' : '-';
            problem = `${formatDecimal(num1)} ${op1} ${formatDecimal(num2)} ${op2} ${formatDecimal(num3)}`;
            result = eval(`${num1} ${op1} ${num2} ${op2} ${num3}`);
        } else {
            const num1 = ensureDecimal(Math.floor(Math.random() * 80) + (Math.floor(Math.random() * 99) + 1) / 100);
            const num2 = ensureDecimal(Math.floor(Math.random() * 40) + (Math.floor(Math.random() * 99) + 1) / 100);
            const num3 = ensureDecimal(Math.floor(Math.random() * 30) + (Math.floor(Math.random() * 99) + 1) / 100);
            const num4 = ensureDecimal(Math.floor(Math.random() * 20) + (Math.floor(Math.random() * 99) + 1) / 100);
            const op1 = Math.random() < 0.5 ? '+' : '-';
            const op2 = Math.random() < 0.5 ? '+' : '-';
            const op3 = Math.random() < 0.5 ? '+' : '-';
            problem = `${formatDecimal(num1)} ${op1} ${formatDecimal(num2)} ${op2} ${formatDecimal(num3)} ${op3} ${formatDecimal(num4)}`;
            result = eval(`${num1} ${op1} ${num2} ${op2} ${num3} ${op3} ${num4}`);
        }
        regularProblems.push({ problem, result: formatDecimal(result), steps: '' });
    }
    const allProblems = [...simplifiedProblems, ...regularProblems];
    allProblems.sort(() => Math.random() - 0.5);
    allProblems.forEach((problem, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem';
        el.innerHTML = `
            <div class="flex items-start">
                <span class="font-medium mr-2">${index + 1}.</span>
                <div class="flex-1">
                    <div>${problem.problem} =</div>
                    <div class="s1-workspace"></div>
                </div>
            </div>
        `;
        container.appendChild(el);
        allAnswers.simplified.push(problem);
    });
}

function printProblems() { window.print(); }
