<script>
// ============================================================
//  五年级小数乘除法核心逻辑（保留全部功能）
// ============================================================
let currentSeed = 0;
let allAnswers = { oral: [], multiplication: [], division: [], simplified: [] };

const themeToggle = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
const themeLabel = document.getElementById('theme-label');

function initThemeUI() {
    const isDark = document.documentElement.classList.contains('dark');
    if (isDark) {
        themeIcon.className = 'fa fa-sun-o mr-2';
        themeLabel.textContent = '亮色';
    } else {
        themeIcon.className = 'fa fa-moon-o mr-2';
        themeLabel.textContent = '暗色';
    }
}
themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeUI();
});
initThemeUI();

document.addEventListener('DOMContentLoaded', function() {
    setCurrentDateAndSeed();
    generateAllProblems();
    document.getElementById('generate-btn').addEventListener('click', generateNewRandomSeed);
    document.getElementById('show-answer-btn').addEventListener('click', toggleAnswers);
    document.getElementById('print-btn').addEventListener('click', printProblems);
    document.getElementById('seed-input').addEventListener('change', generateProblemsFromInput);
});

function getTodaySeed() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor(today.getTime() / 1000);
}
function getTomorrowSeed() {
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    return Math.floor(tomorrow.getTime() / 1000);
}
function setCurrentDateAndSeed() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    currentSeed = getTodaySeed();
    const formattedDate = formatDate(today);
    document.getElementById('current-date').textContent = formattedDate;
    document.getElementById('seed-input').value = currentSeed;
    document.getElementById('print-date').textContent = formattedDate;
    document.getElementById('print-seed').textContent = currentSeed;
}
function formatDate(date) {
    return `${date.getFullYear()}年${String(date.getMonth() + 1).padStart(2, '0')}月${String(date.getDate()).padStart(2, '0')}日`;
}
function generateProblemsFromInput() {
    const seedInput = document.getElementById('seed-input');
    const newSeed = parseInt(seedInput.value);
    if (!isNaN(newSeed)) {
        currentSeed = newSeed;
        generateAllProblems();
        document.getElementById('answer-section').classList.add('hidden');
        document.getElementById('print-seed').textContent = currentSeed;
    } else {
        alert('请输入有效的种子数值！');
        seedInput.value = currentSeed;
    }
}
function generateNewRandomSeed() {
    try {
        const todaySeed = getTodaySeed(), tomorrowSeed = getTomorrowSeed();
        const seedInput = document.getElementById('seed-input');
        const inputSeed = parseInt(seedInput.value);
        if (inputSeed < todaySeed || inputSeed >= tomorrowSeed) {
            currentSeed = todaySeed;
        } else {
            currentSeed = currentSeed + 1;
            if (currentSeed >= tomorrowSeed) currentSeed = todaySeed;
        }
        document.getElementById('seed-input').value = currentSeed;
        document.getElementById('print-seed').textContent = currentSeed;
        generateAllProblems();
        document.getElementById('answer-section').classList.add('hidden');
    } catch (error) {
        console.error('重新生成按钮出错:', error);
        alert('重新生成时出错，请刷新页面重试');
    }
}
function toggleAnswers() {
    const answerSection = document.getElementById('answer-section');
    const showAnswerBtn = document.getElementById('show-answer-btn');
    if (answerSection.classList.contains('hidden')) {
        answerSection.classList.remove('hidden');
        showAnswerBtn.innerHTML = '<i class="fa fa-eye-slash mr-2"></i>隐藏答案';
        displayAllAnswers();
    } else {
        answerSection.classList.add('hidden');
        showAnswerBtn.innerHTML = '<i class="fa fa-check-circle mr-2"></i>显示答案';
    }
}

function displayAllAnswers() {
    const answersContainer = document.getElementById('answers-container');
    answersContainer.innerHTML = '';

    // 一、口算答案
    const oralAnswersDiv = document.createElement('div');
    oralAnswersDiv.className = 'mb-6';
    oralAnswersDiv.innerHTML = `
        <h3 class="text-lg font-bold text-accent dark:text-blue-300 mb-3">一、口算答案</h3>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="oral-answers"></div>
    `;
    answersContainer.appendChild(oralAnswersDiv);
    const oralAnswersContainer = document.getElementById('oral-answers');
    allAnswers.oral.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem s1-answer';
        el.innerHTML = `<div class="font-medium">${index + 1}. ${item.problem} = ${item.result}</div>`;
        oralAnswersContainer.appendChild(el);
    });

    // 二、小数乘法竖式答案
    const mulAnswersDiv = document.createElement('div');
    mulAnswersDiv.className = 'mb-6';
    mulAnswersDiv.innerHTML = `
        <h3 class="text-lg font-bold text-accent dark:text-blue-300 mb-3">二、小数乘法竖式答案</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="mul-answers"></div>
    `;
    answersContainer.appendChild(mulAnswersDiv);
    const mulAnswersContainer = document.getElementById('mul-answers');
    allAnswers.multiplication.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem s1-answer';
        el.innerHTML = `<div class="font-medium">${index + 1}. ${item.num1} × ${item.num2} = ${item.result}</div>`;
        mulAnswersContainer.appendChild(el);
    });

    // 三、小数除法竖式答案
    const divAnswersDiv = document.createElement('div');
    divAnswersDiv.className = 'mb-6';
    divAnswersDiv.innerHTML = `
        <h3 class="text-lg font-bold text-accent dark:text-blue-300 mb-3">三、小数除法竖式答案</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="div-answers"></div>
    `;
    answersContainer.appendChild(divAnswersDiv);
    const divAnswersContainer = document.getElementById('div-answers');
    allAnswers.division.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem s1-answer';
        el.innerHTML = `<div class="font-medium">${index + 1}. ${item.dividend} ÷ ${item.divisor} = ${item.quotient}</div>`;
        divAnswersContainer.appendChild(el);
    });

    // 四、简便运算答案
    const simpAnswersDiv = document.createElement('div');
    simpAnswersDiv.className = 'mb-6';
    simpAnswersDiv.innerHTML = `
        <h3 class="text-lg font-bold text-accent dark:text-blue-300 mb-3">四、简便运算答案</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="simp-answers"></div>
    `;
    answersContainer.appendChild(simpAnswersDiv);
    const simpAnswersContainer = document.getElementById('simp-answers');
    allAnswers.simplified.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem s1-answer';
        el.innerHTML = `
            <div class="font-medium">${index + 1}. ${item.problem} = ${item.result}</div>
            <div class="text-sm mt-1 text-green-700 dark:text-green-300">${item.steps || ''}</div>
        `;
        simpAnswersContainer.appendChild(el);
    });
}

function generateAllProblems() {
    Math.seedrandom(currentSeed.toString());
    generateOralProblems();
    generateMultiplicationProblems();
    generateDivisionProblems();
    generateSimplifiedProblems();
}

function formatDecimal(num) {
    if (typeof num === 'string') num = parseFloat(num);
    let rounded = Math.round(num * 1000) / 1000;
    if (Number.isInteger(rounded)) return rounded.toString();
    let str = rounded.toString();
    if (str.includes('.')) str = str.replace(/\.?0+$/, '');
    return str;
}

function randomDecimal(min, max, decimalPlaces) {
    const range = max - min;
    let value = min + Math.random() * range;
    value = Math.round(value * Math.pow(10, decimalPlaces)) / Math.pow(10, decimalPlaces);
    if (Number.isInteger(value)) {
        value = value + (Math.floor(Math.random() * 9) + 1) / Math.pow(10, decimalPlaces);
        value = Math.round(value * Math.pow(10, decimalPlaces)) / Math.pow(10, decimalPlaces);
    }
    return formatDecimal(value);
}

function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ================= 一、口算题（6道：2道ab + 2道abx + 2道xy0，顺序打乱） =================
function generateOralProblems() {
    const container = document.getElementById('oral-problems');
    container.innerHTML = '';
    allAnswers.oral = [];

    const pairs = [
        [2.5, 0.4, 1],
        [0.25, 4, 1],
        [1.25, 8, 10],
        [0.8, 12.5, 10],
        [0.5, 2, 1],
        [0.25, 8, 2],
        [1.25, 4, 5],
        [0.5, 20, 10],
        [0.4, 25, 10],
        [2.5, 4, 10],
        [1.25, 0.8, 1],
        [0.75, 4, 3]
    ];

    const problemList = [];

    // 2 道 a × b
    for (let i = 0; i < 2; i++) {
        const pair = pairs[Math.floor(Math.random() * pairs.length)];
        const [a, b, ab] = pair;
        problemList.push({
            problem: `${formatDecimal(a)} × ${formatDecimal(b)}`,
            result: formatDecimal(ab)
        });
    }

    // 2 道 a × b × x
    for (let i = 0; i < 2; i++) {
        const pair = pairs[Math.floor(Math.random() * pairs.length)];
        const [a, b, ab] = pair;
        let x = randomDecimal(1, 9, 1);
        while (parseFloat(x) === a || parseFloat(x) === b) {
            x = randomDecimal(1, 9, 1);
        }
        problemList.push({
            problem: `${formatDecimal(a)} × ${formatDecimal(b)} × ${x}`,
            result: formatDecimal(ab * parseFloat(x))
        });
    }

    // 2 道 x × y × 0
    for (let i = 0; i < 2; i++) {
        let x = randomDecimal(1, 9, 1);
        let y = randomDecimal(1, 9, 1);
        while (parseFloat(x) === parseFloat(y)) {
            y = randomDecimal(1, 9, 1);
        }
        problemList.push({
            problem: `${x} × ${y} × 0`,
            result: '0'
        });
    }

    const problems = shuffleArray(problemList);

    problems.forEach((prob, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem';
        el.innerHTML = `<div class="font-medium">${index + 1}. ${prob.problem} =</div>`;
        container.appendChild(el);
        allAnswers.oral.push(prob);
    });
}

// ================= 二、小数乘法竖式 =================
function generateMultiplicationProblems() {
    const container = document.getElementById('multiplication-problems');
    container.innerHTML = '';
    allAnswers.multiplication = [];

    const problems = [];
    for (let i = 0; i < 3; i++) {
        let num1, num2;
        if (i === 0) {
            num1 = randomDecimal(1, 9, 1);
            num2 = randomDecimal(1, 9, 1);
        } else if (i === 1) {
            num1 = randomDecimal(1, 9, 2);
            num2 = randomDecimal(1, 9, 1);
        } else {
            num1 = randomDecimal(1, 9, 2);
            num2 = randomDecimal(1, 9, 2);
        }
        const n1 = parseFloat(num1);
        const n2 = parseFloat(num2);
        const product = n1 * n2;
        const resultStr = formatDecimal(parseFloat(product.toFixed(3)));
        problems.push({ num1, num2, result: resultStr });
    }

    problems.forEach((prob, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem';
        el.innerHTML = `
            <div class="mb-2 font-medium">${index + 1}. ${prob.num1} × ${prob.num2} =</div>
            <div class="s1-workspace"></div>
        `;
        container.appendChild(el);
        allAnswers.multiplication.push(prob);
    });
}

// ================= 三、小数除法竖式 =================
function generateDivisionProblems() {
    const container = document.getElementById('division-problems');
    container.innerHTML = '';
    allAnswers.division = [];

    const problems = [];
    for (let i = 0; i < 3; i++) {
        let dividend, divisor, quotient;
        if (i === 0) {
            divisor = randomDecimal(1, 9, 1);
            quotient = randomDecimal(1, 9, 1);
            const d = parseFloat(divisor);
            const q = parseFloat(quotient);
            dividend = formatDecimal(parseFloat((d * q).toFixed(3)));
        } else if (i === 1) {
            divisor = randomDecimal(1, 9, 1);
            quotient = randomDecimal(1, 9, 2);
            const d = parseFloat(divisor);
            const q = parseFloat(quotient);
            dividend = formatDecimal(parseFloat((d * q).toFixed(4)));
        } else {
            divisor = randomDecimal(1, 9, 2);
            quotient = randomDecimal(1, 9, 1);
            const d = parseFloat(divisor);
            const q = parseFloat(quotient);
            dividend = formatDecimal(parseFloat((d * q).toFixed(4)));
        }
        const dNum = parseFloat(dividend);
        const divNum = parseFloat(divisor);
        const qNum = dNum / divNum;
        const qStr = formatDecimal(parseFloat(qNum.toFixed(3)));
        problems.push({ dividend, divisor, quotient: qStr });
    }

    problems.forEach((prob, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem';
        el.innerHTML = `
            <div class="mb-2 font-medium">${index + 1}. ${prob.dividend} ÷ ${prob.divisor} =</div>
            <div class="s1-workspace"></div>
        `;
        container.appendChild(el);
        allAnswers.division.push(prob);
    });
}

// ================= 四、简便运算 =================
function generateSimplifiedProblems() {
    const container = document.getElementById('simplified-problems');
    container.innerHTML = '';
    allAnswers.simplified = [];

    const templates = [
        () => {
            const c = randomDecimal(2, 9, 1);
            const result = 1.25 * 0.8 * parseFloat(c);
            return {
                problem: `1.25 × 0.8 × ${c}`,
                result: formatDecimal(result),
                steps: `= (1.25 × 0.8) × ${c} = 1 × ${c} = ${formatDecimal(result)}`
            };
        },
        () => {
            const b = randomDecimal(1, 9, 1);
            const result = 0.25 * parseFloat(b) * 4;
            return {
                problem: `0.25 × ${b} × 4`,
                result: formatDecimal(result),
                steps: `= (0.25 × 4) × ${b} = 1 × ${b} = ${formatDecimal(result)}`
            };
        },
        () => {
            const common = randomDecimal(1, 9, 1);
            const result = parseFloat(common) * (2.5 + 7.5);
            return {
                problem: `${common} × 2.5 + ${common} × 7.5`,
                result: formatDecimal(result),
                steps: `= ${common} × (2.5 + 7.5) = ${common} × 10 = ${formatDecimal(result)}`
            };
        },
        () => {
            const common = randomDecimal(2, 9, 1);
            const result = parseFloat(common) * (9.9 + 0.1);
            return {
                problem: `${common} × 9.9 + ${common} × 0.1`,
                result: formatDecimal(result),
                steps: `= ${common} × (9.9 + 0.1) = ${common} × 10 = ${formatDecimal(result)}`
            };
        },
        () => {
            const result = 2.5 * 3.2 * 1.25;
            return {
                problem: `2.5 × 3.2 × 1.25`,
                result: formatDecimal(result),
                steps: `= (2.5 × 4) × (1.25 × 0.8) = 10 × 1 = 10`
            };
        },
        () => {
            const a = randomDecimal(2, 8, 1);
            const aNum = parseFloat(a);
            const b = formatDecimal(10 - aNum);
            const result = (aNum + parseFloat(b)) * 0.25;
            return {
                problem: `${a} × 0.25 + ${b} × 0.25`,
                result: formatDecimal(result),
                steps: `= (${a} + ${b}) × 0.25 = 10 × 0.25 = 2.5`
            };
        },
        () => {
            const a = randomDecimal(4, 9, 1);
            const result = parseFloat(a) / 0.8 / 1.25;
            return {
                problem: `${a} ÷ 0.8 ÷ 1.25`,
                result: formatDecimal(result),
                steps: `= ${a} ÷ (0.8 × 1.25) = ${a} ÷ 1 = ${formatDecimal(result)}`
            };
        },
        () => {
            const result = 12.5 * (8.8 - 0.8);
            return {
                problem: `12.5 × 8.8 - 12.5 × 0.8`,
                result: formatDecimal(result),
                steps: `= 12.5 × (8.8 - 0.8) = 12.5 × 8 = 100`
            };
        },
        () => {
            const pairs = [
                [0.8, 12.5, 10],
                [0.4, 25, 10],
                [2.5, 4, 10],
                [1.25, 8, 10],
                [0.25, 4, 1],
                [0.5, 2, 1],
                [1.5, 2, 3],
                [2.5, 8, 20],
                [1.25, 4, 5],
                [0.75, 4, 3]
            ];
            const [a, x, ax] = pairs[Math.floor(Math.random() * pairs.length)];
            let b = randomDecimal(1, 9, 1);
            while (parseFloat(b) === a) {
                b = randomDecimal(1, 9, 1);
            }
            const bNum = parseFloat(b);
            const result = (a + bNum) * x;
            const bx = bNum * x;
            return {
                problem: `(${formatDecimal(a)} + ${b}) × ${formatDecimal(x)}`,
                result: formatDecimal(result),
                steps: `= ${formatDecimal(a)} × ${formatDecimal(x)} + ${b} × ${formatDecimal(x)} = ${formatDecimal(ax)} + ${formatDecimal(bx)} = ${formatDecimal(result)}`
            };
        }
    ];

    const shuffled = shuffleArray(templates.map((fn, i) => ({ fn, i })));
    const chosen = [];
    const usedIdx = new Set();
    for (const item of shuffled) {
        if (chosen.length >= 3) break;
        if (!usedIdx.has(item.i)) {
            usedIdx.add(item.i);
            chosen.push(item.fn);
        }
    }

    const problems = chosen.map(fn => fn());

    problems.forEach((prob, index) => {
        const el = document.createElement('div');
        el.className = 's1-problem';
        el.innerHTML = `
            <div class="mb-2 font-medium">${index + 1}. ${prob.problem} =</div>
            <div class="s1-workspace"></div>
        `;
        container.appendChild(el);
        allAnswers.simplified.push(prob);
    });
}

function printProblems() {
    window.print();
}
</script>
