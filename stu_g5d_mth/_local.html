<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小数专项练习 · 乘法·除法·简便运算</title>
    <link rel="icon" href="../../../sources/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../../../sources/favicon.ico">
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- seedrandom.js 用于生成确定的随机数序列 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#93c5fd',
                        accent: '#1d4ed8',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#94a3b8'
                    },
                    fontFamily: {
                        sans: ['Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card {
                @apply bg-white rounded-lg shadow-card p-4 transition-all duration-300;
            }
            .card:hover {
                @apply shadow-card-hover;
            }
            .btn-primary {
                @apply bg-primary text-white px-6 py-2 rounded-lg hover:bg-accent transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50;
            }
            .btn-secondary {
                @apply bg-secondary text-accent px-6 py-2 rounded-lg hover:bg-blue-300 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-opacity-50;
            }
            .btn-success {
                @apply bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50;
            }
            .section-title {
                @apply text-xl font-bold text-accent mb-4 flex items-center;
            }
            .section-title i {
                @apply mr-2;
            }
            .math-problem {
                @apply mb-3 p-3 bg-neutral rounded-md;
            }
            .answer {
                @apply bg-green-100 text-green-800 font-medium;
            }
            .print-info {
                @apply hidden;
            }
            .work-space {
                @apply mt-2 h-28 w-full border border-dashed border-gray-300 rounded;
            }
            @media print {
                .no-print {
                    @apply hidden;
                }
                .print-info {
                    @apply block text-sm text-gray-600 ml-4;
                }
                .header-container {
                    @apply flex items-center justify-between;
                }
                .header-main {
                    @apply text-left;
                }
                .work-space {
                    @apply h-32;
                }
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 头部信息 -->
        <header class="mb-4 header-container">
            <div class="header-main">
                <h1 class="text-3xl font-bold text-accent mb-2">小数专项练习 · 乘法·除法·简便运算</h1>
                <p class="text-neutral-dark"><b><img src="../../../sources/favicon.png" style="display: inline; width: 20px; height: auto;" class="text-lg text-gray-600">林耀爱学习（主站附属应用）</b> · 小数乘法竖式 · 小数除法竖式 · 简便运算</p>
            </div>
            <div class="print-info">
                <div><i class="fa fa-calendar mr-1"></i><span id="print-date"></span></div>
                <div><i class="fa fa-random mr-1"></i>种子: <span id="print-seed"></span></div>
            </div>
        </header>

        <!-- 操作区域 -->
        <div class="card mb-6 no-print">
            <div class="flex flex-wrap justify-between items-center">
                <div class="flex items-center mb-4 sm:mb-0">
                    <i class="fa fa-calendar text-primary mr-2"></i>
                    <span id="current-date" class="text-lg font-medium"></span>
                </div>
                <div class="flex flex-wrap items-center justify-center gap-4">
                    <div class="flex items-center">
                        <i class="fa fa-random text-primary mr-2"></i>
                        <span class="text-lg font-medium">种子: </span>
                        <input type="number" id="seed-input" class="ml-1 text-lg font-medium font-mono border border-gray-300 rounded px-2 py-1 w-32 text-center">
                    </div>
                    <div class="flex space-x-2">
                        <button id="generate-btn" class="btn-primary flex items-center">
                            <i class="fa fa-refresh mr-2"></i>
                            重新生成
                        </button>
                        <button id="show-answer-btn" class="btn-success flex items-center">
                            <i class="fa fa-check-circle mr-2"></i>
                            显示答案
                        </button>
                        <button id="print-btn" class="btn-secondary flex items-center">
                            <i class="fa fa-print mr-2"></i>
                            打印练习
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 题目区域：三板块，每个板块内题目横向排列，每行3题 -->
        <div class="space-y-6 mb-8">
            <!-- 板块一：小数乘法竖式 -->
            <div class="card">
                <h2 class="section-title">
                    <i class="fa fa-times"></i>
                    一、小数乘法竖式（3道，末题验算）
                </h2>
                <div id="multiplication-problems" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 乘法题将在这里生成 -->
                </div>
            </div>

            <!-- 板块二：小数除法竖式 -->
            <div class="card">
                <h2 class="section-title">
                    <i class="fa fa-divide"></i>
                    二、小数除法竖式（3道，末题验算）
                </h2>
                <div id="division-problems" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 除法题将在这里生成 -->
                </div>
            </div>

            <!-- 板块三：简便运算 -->
            <div class="card">
                <h2 class="section-title">
                    <i class="fa fa-magic"></i>
                    三、简便运算（3道）
                </h2>
                <div id="simplified-problems" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 简便运算题将在这里生成 -->
                </div>
            </div>
        </div>

        <!-- 答案区域 -->
        <div id="answer-section" class="card mb-8 hidden">
            <h2 class="section-title">
                <i class="fa fa-check-square-o"></i>
                参考答案
            </h2>
            <div id="answers-container">
                <!-- 答案将在这里显示 -->
            </div>
        </div>

        <!-- 页脚信息 -->
        <footer></footer><script src="../../../sources/js/copyright/copyright-parse.js" type="module"></script>
    </div>

    <script>
        // 全局变量
        let currentSeed = 0;
        let allAnswers = {
            multiplication: [],
            division: [],
            simplified: []
        };

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            setCurrentDateAndSeed();
            generateAllProblems();
            document.getElementById('generate-btn').addEventListener('click', generateNewRandomSeed);
            document.getElementById('show-answer-btn').addEventListener('click', toggleAnswers);
            document.getElementById('print-btn').addEventListener('click', printProblems);
            document.getElementById('seed-input').addEventListener('change', generateProblemsFromInput);
        });

        // 获取当天凌晨的时间戳作为基础种子
        function getTodaySeed() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.floor(today.getTime() / 1000);
        }

        // 获取明天凌晨的时间戳
        function getTomorrowSeed() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            return Math.floor(tomorrow.getTime() / 1000);
        }

        // 设置当前日期和种子
        function setCurrentDateAndSeed() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            currentSeed = getTodaySeed();

            const formattedDate = formatDate(today);
            document.getElementById('current-date').textContent = formattedDate;
            document.getElementById('seed-input').value = currentSeed;

            document.getElementById('print-date').textContent = formattedDate;
            document.getElementById('print-seed').textContent = currentSeed;
        }

        // 格式化日期为 YYYY年MM月DD日
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        // 从输入框生成题目
        function generateProblemsFromInput() {
            const seedInput = document.getElementById('seed-input');
            const newSeed = parseInt(seedInput.value);
            if (!isNaN(newSeed)) {
                currentSeed = newSeed;
                generateAllProblems();
                document.getElementById('answer-section').classList.add('hidden');
                document.getElementById('print-seed').textContent = currentSeed;
            } else {
                alert('请输入有效的种子数值！');
                seedInput.value = currentSeed;
            }
        }

        // 生成新的随机种子
        function generateNewRandomSeed() {
            try {
                const todaySeed = getTodaySeed();
                const tomorrowSeed = getTomorrowSeed();
                const seedInput = document.getElementById('seed-input');
                const inputSeed = parseInt(seedInput.value);
                if (inputSeed < todaySeed || inputSeed >= tomorrowSeed) {
                    currentSeed = todaySeed;
                } else {
                    currentSeed = currentSeed + 1;
                    if (currentSeed >= tomorrowSeed) {
                        currentSeed = todaySeed;
                    }
                }
                document.getElementById('seed-input').value = currentSeed;
                document.getElementById('print-seed').textContent = currentSeed;
                generateAllProblems();
                document.getElementById('answer-section').classList.add('hidden');
            } catch (error) {
                console.error('重新生成按钮出错:', error);
                alert('重新生成时出错，请刷新页面重试');
            }
        }

        // 切换答案显示
        function toggleAnswers() {
            const answerSection = document.getElementById('answer-section');
            const showAnswerBtn = document.getElementById('show-answer-btn');
            if (answerSection.classList.contains('hidden')) {
                answerSection.classList.remove('hidden');
                showAnswerBtn.innerHTML = '<i class="fa fa-eye-slash mr-2"></i>隐藏答案';
                displayAllAnswers();
            } else {
                answerSection.classList.add('hidden');
                showAnswerBtn.innerHTML = '<i class="fa fa-check-circle mr-2"></i>显示答案';
            }
        }

        // 显示所有答案
        function displayAllAnswers() {
            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';

            // ===== 乘法答案 =====
            const mulAnswersDiv = document.createElement('div');
            mulAnswersDiv.className = 'mb-6';
            mulAnswersDiv.innerHTML = `
                <h3 class="text-lg font-bold text-accent mb-3">一、小数乘法竖式答案</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="mul-answers"></div>
            `;
            answersContainer.appendChild(mulAnswersDiv);

            const mulAnswersContainer = document.getElementById('mul-answers');
            allAnswers.multiplication.forEach((item, index) => {
                const answerElement = document.createElement('div');
                answerElement.className = 'math-problem answer';
                let verifyText = item.needVerify ? '（需验算）' : '';
                answerElement.innerHTML = `
                    <div class="font-medium">${index + 1}. ${item.num1} × ${item.num2} = ${item.result} ${verifyText}</div>
                    ${item.needVerify ? `<div class="text-sm mt-1">验算：${item.num2} × ${item.num1} = ${item.result}</div>` : ''}
                `;
                mulAnswersContainer.appendChild(answerElement);
            });

            // ===== 除法答案 =====
            const divAnswersDiv = document.createElement('div');
            divAnswersDiv.className = 'mb-6';
            divAnswersDiv.innerHTML = `
                <h3 class="text-lg font-bold text-accent mb-3">二、小数除法竖式答案</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="div-answers"></div>
            `;
            answersContainer.appendChild(divAnswersDiv);

            const divAnswersContainer = document.getElementById('div-answers');
            allAnswers.division.forEach((item, index) => {
                const answerElement = document.createElement('div');
                answerElement.className = 'math-problem answer';
                let verifyText = item.needVerify ? '（需验算）' : '';
                answerElement.innerHTML = `
                    <div class="font-medium">${index + 1}. ${item.dividend} ÷ ${item.divisor} = ${item.quotient} ${verifyText}</div>
                    ${item.needVerify ? `<div class="text-sm mt-1">验算：${item.quotient} × ${item.divisor} = ${item.dividend}</div>` : ''}
                `;
                divAnswersContainer.appendChild(answerElement);
            });

            // ===== 简便运算答案 =====
            const simpAnswersDiv = document.createElement('div');
            simpAnswersDiv.className = 'mb-6';
            simpAnswersDiv.innerHTML = `
                <h3 class="text-lg font-bold text-accent mb-3">三、简便运算答案</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="simp-answers"></div>
            `;
            answersContainer.appendChild(simpAnswersDiv);

            const simpAnswersContainer = document.getElementById('simp-answers');
            allAnswers.simplified.forEach((item, index) => {
                const answerElement = document.createElement('div');
                answerElement.className = 'math-problem answer';
                answerElement.innerHTML = `
                    <div class="font-medium">${index + 1}. ${item.problem} = ${item.result}</div>
                    <div class="text-sm mt-1 text-green-700">${item.steps || ''}</div>
                `;
                simpAnswersContainer.appendChild(answerElement);
            });
        }

        // 生成所有题目
        function generateAllProblems() {
            Math.seedrandom(currentSeed.toString());
            generateMultiplicationProblems();
            generateDivisionProblems();
            generateSimplifiedProblems();
        }

        // ================= 通用工具 =================

        // 格式化小数：去除末尾多余的0，但至少保留一位小数（绝不出现.0）
        function formatDecimal(num) {
            if (typeof num === 'string') num = parseFloat(num);
            let rounded = Math.round(num * 1000) / 1000;
            if (Number.isInteger(rounded)) {
                return rounded.toString();
            }
            let str = rounded.toString();
            if (str.includes('.')) {
                str = str.replace(/\.?0+$/, '');
            }
            return str;
        }

        // 生成随机小数，位数可为1、2、3位
        function randomDecimal(min, max, decimalPlaces) {
            const range = max - min;
            let value = min + Math.random() * range;
            value = Math.round(value * Math.pow(10, decimalPlaces)) / Math.pow(10, decimalPlaces);
            if (Number.isInteger(value)) {
                value = value + (Math.floor(Math.random() * 9) + 1) / Math.pow(10, decimalPlaces);
                value = Math.round(value * Math.pow(10, decimalPlaces)) / Math.pow(10, decimalPlaces);
            }
            return formatDecimal(value);
        }

        // ================= 一、小数乘法竖式 =================
        function generateMultiplicationProblems() {
            const container = document.getElementById('multiplication-problems');
            container.innerHTML = '';
            allAnswers.multiplication = [];

            const problems = [];
            for (let i = 0; i < 3; i++) {
                let num1, num2;
                if (i === 0) {
                    // 两位小数 × 一位小数
                    num1 = randomDecimal(1, 20, 2);
                    num2 = randomDecimal(1, 9, 1);
                } else if (i === 1) {
                    // 三位小数 × 两位小数
                    num1 = randomDecimal(1, 12, 3);
                    num2 = randomDecimal(1, 9, 2);
                } else {
                    // 两位小数 × 两位小数
                    num1 = randomDecimal(1, 15, 2);
                    num2 = randomDecimal(1, 15, 2);
                }
                const n1 = parseFloat(num1);
                const n2 = parseFloat(num2);
                const product = n1 * n2;
                const resultStr = formatDecimal(parseFloat(product.toFixed(3)));
                const needVerify = (i === 2);

                problems.push({
                    num1: num1,
                    num2: num2,
                    result: resultStr,
                    needVerify: needVerify
                });
            }

            problems.forEach((prob, index) => {
                const problemElement = document.createElement('div');
                problemElement.className = 'math-problem';
                let verifyHint = '';
                if (prob.needVerify) {
                    verifyHint = '<span class="text-sm text-gray-500 ml-2">（需验算）</span>';
                }
                problemElement.innerHTML = `
                    <div class="mb-2 font-medium">${index + 1}. ${prob.num1} × ${prob.num2} = ${verifyHint}</div>
                    <div class="work-space"></div>
                `;
                container.appendChild(problemElement);
                allAnswers.multiplication.push(prob);
            });
        }

        // ================= 二、小数除法竖式 =================
        function generateDivisionProblems() {
            const container = document.getElementById('division-problems');
            container.innerHTML = '';
            allAnswers.division = [];

            const problems = [];
            for (let i = 0; i < 3; i++) {
                let dividend, divisor, quotient;
                if (i === 0) {
                    // 两位小数 ÷ 一位小数，商为两位小数
                    divisor = randomDecimal(1, 9, 1);
                    quotient = randomDecimal(1, 20, 2);
                    const d = parseFloat(divisor);
                    const q = parseFloat(quotient);
                    dividend = formatDecimal(parseFloat((d * q).toFixed(3)));
                } else if (i === 1) {
                    // 三位小数 ÷ 两位小数，商为两位小数
                    divisor = randomDecimal(1, 9, 2);
                    quotient = randomDecimal(1, 12, 2);
                    const d = parseFloat(divisor);
                    const q = parseFloat(quotient);
                    dividend = formatDecimal(parseFloat((d * q).toFixed(4)));
                } else {
                    // 两位小数 ÷ 两位小数，商为一位小数（用于验算）
                    divisor = randomDecimal(1, 9, 2);
                    quotient = randomDecimal(1, 10, 1);
                    const d = parseFloat(divisor);
                    const q = parseFloat(quotient);
                    dividend = formatDecimal(parseFloat((d * q).toFixed(4)));
                }

                const dNum = parseFloat(dividend);
                const divNum = parseFloat(divisor);
                const qNum = dNum / divNum;
                const qStr = formatDecimal(parseFloat(qNum.toFixed(3)));
                const needVerify = (i === 2);

                problems.push({
                    dividend: dividend,
                    divisor: divisor,
                    quotient: qStr,
                    needVerify: needVerify
                });
            }

            problems.forEach((prob, index) => {
                const problemElement = document.createElement('div');
                problemElement.className = 'math-problem';
                let verifyHint = '';
                if (prob.needVerify) {
                    verifyHint = '<span class="text-sm text-gray-500 ml-2">（需验算）</span>';
                }
                problemElement.innerHTML = `
                    <div class="mb-2 font-medium">${index + 1}. ${prob.dividend} ÷ ${prob.divisor} = ${verifyHint}</div>
                    <div class="work-space"></div>
                `;
                container.appendChild(problemElement);
                allAnswers.division.push(prob);
            });
        }

        // ================= 三、简便运算 =================
        function generateSimplifiedProblems() {
            const container = document.getElementById('simplified-problems');
            container.innerHTML = '';
            allAnswers.simplified = [];

            const templates = [
                // 1. 乘法交换结合：1.25 × 0.8 × 4.5
                () => {
                    const c = randomDecimal(2, 9, 1);
                    const cNum = parseFloat(c);
                    const result = 1.25 * 0.8 * cNum;
                    const problem = `1.25 × 0.8 × ${c}`;
                    const steps = `= (1.25 × 0.8) × ${c} = 1 × ${c} = ${formatDecimal(result)}`;
                    return { problem, result: formatDecimal(result), steps };
                },
                // 2. 乘法交换律：0.25 × 3.7 × 4
                () => {
                    const b = randomDecimal(1, 9, 1);
                    const bNum = parseFloat(b);
                    const result = 0.25 * bNum * 4;
                    const problem = `0.25 × ${b} × 4`;
                    const steps = `= (0.25 × 4) × ${b} = 1 × ${b} = ${formatDecimal(result)}`;
                    return { problem, result: formatDecimal(result), steps };
                },
                // 3. 乘法分配律：5.6 × 2.5 + 5.6 × 7.5
                () => {
                    const common = randomDecimal(1, 9, 1);
                    const commonNum = parseFloat(common);
                    const result = commonNum * (2.5 + 7.5);
                    const problem = `${common} × 2.5 + ${common} × 7.5`;
                    const steps = `= ${common} × (2.5 + 7.5) = ${common} × 10 = ${formatDecimal(result)}`;
                    return { problem, result: formatDecimal(result), steps };
                },
                // 4. 分配律逆运算：8.4 × 9.9 + 8.4 × 0.1
                () => {
                    const common = randomDecimal(2, 9, 1);
                    const commonNum = parseFloat(common);
                    const result = commonNum * (9.9 + 0.1);
                    const problem = `${common} × 9.9 + ${common} × 0.1`;
                    const steps = `= ${common} × (9.9 + 0.1) = ${common} × 10 = ${formatDecimal(result)}`;
                    return { problem, result: formatDecimal(result), steps };
                },
                // 5. 结合律凑整：2.5 × 3.2 × 1.25
                () => {
                    const result = 2.5 * 3.2 * 1.25;
                    const problem = `2.5 × 3.2 × 1.25`;
                    const steps = `= 2.5 × 1.25 × 3.2 = 2.5 × 1.25 × (0.8 × 4) = (1.25 × 0.8) × (2.5 × 4) = 1 × 10 = 10`;
                    return { problem, result: formatDecimal(result), steps };
                },
                // 6. 分配律扩展：4.8 × 0.25 + 5.2 × 0.25
                () => {
                    const a = randomDecimal(2, 8, 1);
                    const aNum = parseFloat(a);
                    const b = formatDecimal(10 - aNum);
                    const result = (aNum + parseFloat(b)) * 0.25;
                    const problem = `${a} × 0.25 + ${b} × 0.25`;
                    const steps = `= (${a} + ${b}) × 0.25 = 10 × 0.25 = 2.5`;
                    return { problem, result: formatDecimal(result), steps };
                },
                // 7. 除法性质简算：7.2 ÷ 0.8 ÷ 1.25
                () => {
                    const a = randomDecimal(4, 9, 1);
                    const aNum = parseFloat(a);
                    const result = aNum / 0.8 / 1.25;
                    const problem = `${a} ÷ 0.8 ÷ 1.25`;
                    const steps = `= ${a} ÷ (0.8 × 1.25) = ${a} ÷ 1 = ${formatDecimal(result)}`;
                    return { problem, result: formatDecimal(result), steps };
                },
                // 8. 乘法分配律带减法：12.5 × 8.8 - 12.5 × 0.8
                () => {
                    const result = 12.5 * (8.8 - 0.8);
                    const problem = `12.5 × 8.8 - 12.5 × 0.8`;
                    const steps = `= 12.5 × (8.8 - 0.8) = 12.5 × 8 = 100`;
                    return { problem, result: formatDecimal(result), steps };
                }
            ];

            const indices = [];
            while (indices.length < 3) {
                const idx = Math.floor(Math.random() * templates.length);
                if (!indices.includes(idx)) indices.push(idx);
            }

            const problems = indices.map(idx => templates[idx]());

            problems.forEach((prob, index) => {
                const problemElement = document.createElement('div');
                problemElement.className = 'math-problem';
                problemElement.innerHTML = `
                    <div class="mb-2 font-medium">${index + 1}. ${prob.problem} =</div>
                    <div class="work-space"></div>
                `;
                container.appendChild(problemElement);
                allAnswers.simplified.push(prob);
            });
        }

        // 打印练习
        function printProblems() {
            window.print();
        }
    </script>
</body>
</html>
