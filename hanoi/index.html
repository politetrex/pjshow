<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉诺塔 · 编程教学工具</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/s1.css">

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#93c5fd',
                        accent: '#1d4ed8',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#94a3b8',
                        'hanoi-orange': '#f0883e',
                    },
                    fontFamily: { sans: ['Arial', 'sans-serif'], mono: ['JetBrains Mono', 'Consolas', 'monospace'] },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
        .s1-code-editor { width: 100%; height: 100%; background: var(--s1-bg-card); color: var(--s1-text); font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 0.875rem; padding: 1rem; border: none; outline: none; resize: none; }
        .s1-line-numbers { width: 3rem; background: var(--s1-neutral); color: var(--s1-text-dim); text-align: right; font-size: 0.75rem; padding: 1rem 0.5rem 1rem 0; user-select: none; display: flex; flex-direction: column; align-items: flex-end; }
        .dark .s1-line-numbers { background: #1e293b; }
        .s1-line-numbers span { display: block; height: 1.7em; line-height: 1.7; padding: 0 0.25rem; }
        .s1-line-current { color: #f0883e; font-weight: 700; background: rgba(240, 136, 62, 0.15); border-radius: 4px; }
        .s1-line-error { color: #ef4444; }
        .s1-resizer { width: 6px; height: 100%; background: var(--s1-border); cursor: col-resize; flex: 0 0 6px; user-select: none; transition: background 0.2s; }
        .s1-resizer:hover { background: #f0883e; }
        body.resizing { cursor: col-resize !important; user-select: none !important; }
        .mode-touch .s1-coding-panel, .mode-touch .s1-resizer { display: none !important; }
        .mode-touch .s1-preview-panel { flex: 1 !important; }

        /* ============ 打印样式 ============ */
        @media print {
            /* 隐藏所有交互控件 */
            header .s1-btn,
            #toolbar,
            .s1-btn,
            .s1-no-print,
            #themeToggle {
                display: none !important;
            }

            body {
                background: #ffffff !important;
                color: #000 !important;
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }

            #mainContainer {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }

            /* 编码面板与预览面板左右并排 */
            .s1-coding-panel,
            .s1-preview-panel {
                display: block !important;
                width: 48% !important;
                float: left !important;
                margin: 1% !important;
                border: 1px solid #333 !important;
                page-break-inside: avoid;
                overflow: visible !important;
                background: #fff !important;
            }

            .s1-resizer { display: none !important; }

            .s1-coding-panel .panel-header,
            .s1-preview-panel .panel-header {
                background: #f3f4f6 !important;
                color: #000 !important;
                border-bottom: 1px solid #333 !important;
            }

            .s1-code-editor {
                height: auto !important;
                min-height: 400px !important;
                background: #fff !important;
                color: #000 !important;
                font-size: 11px !important;
                overflow: visible !important;
                white-space: pre !important;
            }

            .s1-line-numbers {
                background: #f3f4f6 !important;
                color: #666 !important;
            }

            .s1-line-current {
                background: #fef3c7 !important;
                color: #000 !important;
                font-weight: 700 !important;
            }

            #hanoiCanvas {
                background: #fff !important;
                border: 1px solid #333 !important;
                max-width: 100% !important;
                max-height: 350px !important;
                width: auto !important;
                height: auto !important;
            }

            .s1-preview-panel .status-bar,
            .s1-preview-panel .p-2 {
                border-top: 1px solid #333 !important;
                background: #f9fafb !important;
                color: #000 !important;
                font-size: 11px !important;
            }

            .s1-print-info {
                display: block !important;
                text-align: center;
                font-size: 12px;
                margin-bottom: 8px;
                color: #333;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
    <header class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 px-6 py-3 flex items-center justify-between shadow-sm">
        <h1 class="text-xl font-bold text-accent dark:text-blue-300 flex items-center gap-2">🏯 汉诺塔 · 编程教学</h1>
        <div class="flex items-center gap-4 text-sm text-slate-500 dark:text-slate-400">
            <span class="bg-primary text-white px-2 py-0.5 rounded text-xs font-semibold s1-no-print">v2.2</span>
            <span class="hidden sm:inline s1-no-print">指令: <code class="bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded text-xs">mov [0-2] [0-2] ; 注释</code></span>
            <button id="themeToggle" class="s1-btn s1-btn-secondary text-sm px-3 py-1.5 s1-no-print" title="切换明暗模式">
                <i id="themeIcon" class="fa fa-moon-o"></i>
            </button>
        </div>
    </header>

    <!-- 打印专用信息 -->
    <div class="s1-print-info hidden">
        汉诺塔 · <span id="print-hanoi-disks"></span> 层 · <span id="print-hanoi-date"></span>
    </div>

    <div class="flex-1 flex overflow-hidden mode-touch" id="mainContainer">
        <div class="s1-coding-panel flex flex-col w-1/2 min-w-[220px] max-w-[calc(100%-260px)] border-r border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800" id="codingPanel">
            <div class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 px-4 py-2 flex justify-between items-center">
                <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">📄 Coding Panel</span>
                <div class="flex gap-2 s1-no-print">
                    <button class="s1-btn s1-btn-secondary text-xs px-3 py-1" id="formatBtn">格式化</button>
                    <button class="s1-btn s1-btn-secondary text-xs px-3 py-1" id="clearBtn">清空</button>
                </div>
            </div>
            <div class="flex-1 flex overflow-hidden">
                <div class="s1-line-numbers" id="lineNumbers"></div>
                <textarea id="codeEditor" class="s1-code-editor" spellcheck="false" placeholder="; 输入 mov 指令，每行一条&#10;mov 0 1  ; 从柱子0移动到柱子1"></textarea>
            </div>
        </div>
        <div class="s1-resizer" id="panelResizer"></div>
        <div class="s1-preview-panel flex-1 flex flex-col min-w-[240px] bg-slate-50 dark:bg-slate-900" id="previewPanel">
            <div class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 px-4 py-2 flex justify-between items-center">
                <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">👁️ Preview Panel</span>
                <div class="flex gap-4 text-xs text-slate-500 dark:text-slate-400">
                    <span>步骤: <span class="text-hanoi-orange font-bold" id="stepCount">0</span></span>
                    <span>高亮行: <span class="text-hanoi-orange font-bold" id="highlightLine">-</span></span>
                </div>
            </div>
            <div class="flex-1 flex items-center justify-center p-5 relative overflow-hidden">
                <canvas id="hanoiCanvas" class="w-full h-full max-w-[700px] max-h-[400px] bg-white dark:bg-slate-800 rounded-lg shadow-inner"></canvas>
            </div>
            <div class="p-2 bg-slate-100 dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 text-sm flex justify-between items-center flex-wrap gap-2">
                <span class="text-sm text-slate-600 dark:text-slate-400 flex-1" id="statusInfo">💡 就绪 — 点击柱子或编写代码</span>
                <span class="text-sm text-red-500 font-mono" id="errorMsg"></span>
                <span class="text-sm text-slate-500 dark:text-slate-400">移动: <span class="text-hanoi-orange font-bold" id="moveCount">0</span></span>
            </div>
        </div>
    </div>

    <div class="bg-white dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 px-6 py-3 flex items-center gap-4 flex-wrap shadow-sm s1-no-print" id="toolbar">
        <div class="flex items-center gap-2">
            <span class="text-sm text-slate-500 dark:text-slate-400">层数</span>
            <input type="number" id="diskCount" min="1" max="10" value="4" class="w-16 px-2 py-1 border border-gray-300 rounded-lg text-sm text-center dark:bg-slate-700 dark:border-slate-600 dark:text-slate-100">
        </div>
        <div class="flex items-center gap-2">
            <span class="text-sm text-slate-500 dark:text-slate-400">模式</span>
            <div class="flex bg-slate-100 dark:bg-slate-700 rounded-lg p-0.5">
                <button class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors bg-primary text-white" data-mode="touch">👆 触点</button>
                <button class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors text-slate-600 dark:text-slate-300" data-mode="code">⌨️ 编程</button>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-sm text-slate-500 dark:text-slate-400">⏱️</span>
            <span class="font-mono text-lg font-semibold text-hanoi-orange min-w-[70px] text-center" id="timerDisplay">00:00</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-sm text-slate-500 dark:text-slate-400">速度</span>
            <input type="range" id="speedSlider" min="1" max="5" value="3" step="1" class="w-20 accent-primary">
            <span class="text-xs text-slate-500 dark:text-slate-400 min-w-[50px] text-center" id="speedLabel">中</span>
        </div>
        <div class="flex items-center gap-2 ml-auto flex-wrap">
            <button class="s1-btn s1-btn-secondary text-sm px-3 py-1.5" id="undoBtn" disabled>↩ 撤回</button>
            <button class="s1-btn s1-btn-secondary text-sm px-3 py-1.5" id="resetBtn">⟳ 重置</button>
            <button class="s1-btn s1-btn-secondary text-sm px-3 py-1.5" id="commentToggle">💬 注释</button>
            <button class="s1-btn s1-btn-secondary text-sm px-3 py-1.5" id="solverBtn">🤖 自动求解</button>
            <button class="s1-btn s1-btn-secondary text-sm px-3 py-1.5" id="pauseBtn" disabled>⏸️ 暂停</button>
            <button class="s1-btn s1-btn-primary text-sm px-3 py-1.5" id="runBtn" disabled>▶ 运行</button>
            <button class="s1-btn s1-btn-primary text-sm px-3 py-1.5" id="stepBtn" disabled>⏭ 单步</button>
            <button class="s1-btn s1-btn-secondary text-sm px-3 py-1.5" id="printHanoiBtn">🖨️ 打印</button>
        </div>
    </div>

<script>
const state = {
    rods: [[], [], []], diskCount: 4, mode: 'touch', history: [], currentStep: 0,
    isPlaying: false, isPaused: false, timerInterval: null, timerSeconds: 0, timerStarted: false,
    selectedRod: null, isComplete: false, codeQueue: [], isCodeRunning: false, moveCount: 0,
    animating: false, currentHighlightLine: null, withComments: true, execIndex: 0,
    totalInstructions: 0, isExecuting: false, pauseRequested: false, speed: 3,
};

const canvas = document.getElementById('hanoiCanvas');
const ctx = canvas.getContext('2d');
const codeEditor = document.getElementById('codeEditor');
const lineNumbers = document.getElementById('lineNumbers');
const diskCountInput = document.getElementById('diskCount');
const timerDisplay = document.getElementById('timerDisplay');
const stepCount = document.getElementById('stepCount');
const highlightLine = document.getElementById('highlightLine');
const errorMsg = document.getElementById('errorMsg');
const statusInfo = document.getElementById('statusInfo');
const moveCountEl = document.getElementById('moveCount');
const runBtn = document.getElementById('runBtn');
const stepBtn = document.getElementById('stepBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const undoBtn = document.getElementById('undoBtn');
const formatBtn = document.getElementById('formatBtn');
const clearBtn = document.getElementById('clearBtn');
const solverBtn = document.getElementById('solverBtn');
const commentToggle = document.getElementById('commentToggle');
const mainContainer = document.getElementById('mainContainer');
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
const panelResizer = document.getElementById('panelResizer');
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
let isPanelResizing = false;
let resizeStartX = 0;
let resizeStartWidth = 0;

function initThemeIcon() {
    const isDark = document.documentElement.classList.contains('dark');
    themeIcon.className = isDark ? 'fa fa-sun-o' : 'fa fa-moon-o';
}
themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeIcon();
    render();
});
initThemeIcon();

const SPEED_MAP = {
    1: { label: '极慢(10s)', delay: 10000 },
    2: { label: '慢(5s)', delay: 5000 },
    3: { label: '中(3s)', delay: 3000 },
    4: { label: '快(2s)', delay: 2000 },
    5: { label: '极快(1s)', delay: 1000 },
};
function getSpeedDelay() { return SPEED_MAP[parseInt(speedSlider.value)]?.delay || 3000; }
speedSlider.addEventListener('input', () => { state.speed = parseInt(speedSlider.value); speedLabel.textContent = SPEED_MAP[state.speed]?.label || '中'; });

function resizeCanvas() {
    const container = canvas.parentElement;
    const rect = container.getBoundingClientRect();
    const w = Math.min(rect.width - 40, 700);
    const h = Math.min(rect.height - 40, 400);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    canvas.logicalWidth = w;
    canvas.logicalHeight = h;
    render();
}

function render() {
    const w = canvas.logicalWidth || canvas.width;
    const h = canvas.logicalHeight || canvas.height;
    ctx.clearRect(0, 0, w, h);
    const isDark = document.documentElement.classList.contains('dark');
    const rodColor = isDark ? '#484f58' : '#cbd5e1';
    const baseColor = isDark ? '#30363d' : '#94a3b8';
    const rodCount = 3, rodWidth = 8, baseY = h - 40, rodHeight = h - 80;
    const rodSpacing = w / (rodCount + 1);
    const maxDisk = state.diskCount;
    const diskHeight = Math.min(20, (h - 80) / (maxDisk + 1));
    ctx.fillStyle = baseColor;
    ctx.fillRect(20, baseY + 2, w - 40, 6);
    for (let r = 0; r < rodCount; r++) {
        const x = rodSpacing * (r + 1);
        ctx.fillStyle = rodColor;
        ctx.fillRect(x - rodWidth / 2, baseY - rodHeight, rodWidth, rodHeight);
        ctx.fillStyle = '#f0883e';
        ctx.beginPath();
        ctx.arc(x, baseY - rodHeight, rodWidth / 2 + 2, 0, Math.PI * 2);
        ctx.fill();
        const disks = state.rods[r];
        for (let i = 0; i < disks.length; i++) {
            const diskSize = disks[i];
            const ratio = diskSize / maxDisk;
            const diskWidth = 20 + ratio * (w / (rodCount + 1) - 30);
            const y = baseY - (i + 1) * diskHeight - 2;
            const xPos = x - diskWidth / 2;
            const hue = 30 + diskSize * 25;
            const lightness = 50 + diskSize * 3;
            ctx.fillStyle = `hsl(${hue}, 80%, ${lightness}%)`;
            ctx.shadowColor = 'rgba(240, 136, 62, 0.15)';
            ctx.shadowBlur = 6;
            const radius = 4;
            ctx.beginPath();
            ctx.moveTo(xPos + radius, y);
            ctx.lineTo(xPos + diskWidth - radius, y);
            ctx.quadraticCurveTo(xPos + diskWidth, y, xPos + diskWidth, y + radius);
            ctx.lineTo(xPos + diskWidth, y + diskHeight - radius);
            ctx.quadraticCurveTo(xPos + diskWidth, y + diskHeight, xPos + diskWidth - radius, y + diskHeight);
            ctx.lineTo(xPos + radius, y + diskHeight);
            ctx.quadraticCurveTo(xPos, y + diskHeight, xPos, y + diskHeight - radius);
            ctx.lineTo(xPos, y + radius);
            ctx.quadraticCurveTo(xPos, y, xPos + radius, y);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(xPos, y, diskWidth, diskHeight);
            ctx.fillStyle = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.4)';
            ctx.font = `${Math.min(diskHeight * 0.6, 14)}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(diskSize, x, y + diskHeight / 2);
        }
    }
    if (state.mode === 'touch' && state.selectedRod !== null) {
        const x = rodSpacing * (state.selectedRod + 1);
        ctx.strokeStyle = 'rgba(240, 136, 62, 0.6)';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.strokeRect(x - 40, 10, 80, baseY - 20);
        ctx.setLineDash([]);
    }
    if (state.isComplete) {
        ctx.fillStyle = 'rgba(35, 134, 54, 0.15)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#238636';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎉 完成!', w / 2, 50);
    }
}

function initRods(count) {
    state.rods = [[], [], []];
    for (let i = count; i >= 1; i--) state.rods[0].push(i);
    state.diskCount = count;
    state.history = [];
    state.currentStep = 0;
    state.moveCount = 0;
    state.isComplete = false;
    state.selectedRod = null;
    state.codeQueue = [];
    state.isCodeRunning = false;
    state.animating = false;
    state.currentHighlightLine = null;
    state.execIndex = 0;
    state.totalInstructions = 0;
    state.isExecuting = false;
    state.isPaused = false;
    state.timerSeconds = 0;
    state.timerStarted = false;
    clearInterval(state.timerInterval);
    state.timerInterval = null;
    timerDisplay.textContent = '00:00';
    highlightLine.textContent = '-';
    stepCount.textContent = '0';
    moveCountEl.textContent = '0';
    pauseBtn.textContent = '⏸️ 暂停';
    pauseBtn.disabled = true;
    updateUI();
    render();
    updateButtons();
    updateLineNumbers();
}

function isValidMove(from, to) {
    if (from === to) return false;
    if (from < 0 || from > 2 || to < 0 || to > 2) return false;
    const fromRod = state.rods[from], toRod = state.rods[to];
    if (fromRod.length === 0) return false;
    if (toRod.length === 0) return true;
    return fromRod[fromRod.length - 1] < toRod[toRod.length - 1];
}
function doMove(from, to, recordHistory = true) {
    if (!isValidMove(from, to)) return false;
    const disk = state.rods[from].pop();
    state.rods[to].push(disk);
    if (recordHistory) { state.history.push({ from, to, diskSize: disk }); state.currentStep = state.history.length; state.moveCount++; }
    if (state.rods[2].length === state.diskCount) { state.isComplete = true; stopTimer(); }
    updateUI(); render(); updateButtons();
    return true;
}
function undoMove() {
    if (state.history.length === 0 || state.isPlaying || state.animating || state.isExecuting) return;
    const last = state.history.pop();
    const disk = state.rods[last.to].pop();
    state.rods[last.from].push(disk);
    state.currentStep = state.history.length;
    state.moveCount--;
    state.isComplete = false;
    state.currentHighlightLine = null;
    highlightLine.textContent = '-';
    updateUI(); render(); updateButtons(); updateLineNumbers();
    statusInfo.textContent = '↩ 已撤回一步';
    errorMsg.textContent = '';
}
function resetGame() {
    if (state.isPlaying || state.isExecuting) return;
    const count = parseInt(diskCountInput.value) || 4;
    if (count < 1) diskCountInput.value = 1;
    if (count > 10) diskCountInput.value = 10;
    initRods(parseInt(diskCountInput.value));
    state.currentHighlightLine = null;
    highlightLine.textContent = '-';
    statusInfo.textContent = '🔄 已重置';
    errorMsg.textContent = '';
    runBtn.disabled = true;
    stepBtn.disabled = true;
    undoBtn.disabled = true;
    pauseBtn.disabled = true;
    pauseBtn.textContent = '⏸️ 暂停';
    updateLineNumbers();
}

function startTimer() {
    if (state.timerStarted) return;
    state.timerStarted = true;
    state.timerSeconds = 0;
    clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timerSeconds++;
        const m = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
        const s = String(state.timerSeconds % 60).padStart(2, '0');
        timerDisplay.textContent = `${m}:${s}`;
    }, 1000);
}
function stopTimer() { state.timerStarted = false; clearInterval(state.timerInterval); state.timerInterval = null; }
function resetTimer() { stopTimer(); state.timerSeconds = 0; timerDisplay.textContent = '00:00'; state.timerStarted = false; }

function parseCode(code) {
    const lines = code.split('\n');
    const instructions = [];
    const errors = [];
    for (let i = 0; i < lines.length; i++) {
        const lineNum = i + 1;
        const trimmed = lines[i].trim();
        if (trimmed === '') { instructions.push({ type: 'empty', line: lineNum, raw: '' }); continue; }
        if (/^\s*;/.test(trimmed)) { instructions.push({ type: 'comment', line: lineNum, raw: trimmed, content: trimmed.replace(/^\s*;/, '').trim() }); continue; }
        let codePart = trimmed, commentPart = '';
        const commentMatch = trimmed.match(/^(.*?)(\s*;.*)$/);
        if (commentMatch) { codePart = commentMatch[1].trim(); commentPart = commentMatch[2].trim(); }
        const movMatch = codePart.match(/^mov\s+([0-2])\s+([0-2])$/i);
        if (movMatch) {
            instructions.push({ type: 'mov', from: parseInt(movMatch[1]), to: parseInt(movMatch[2]), line: lineNum, raw: trimmed, comment: commentPart || null });
        } else if (codePart !== '') {
            errors.push({ line: lineNum, msg: '无效指令，格式应为 mov 0 1 或 ; 注释' });
        }
    }
    return { instructions, errors };
}
function runLinter() {
    const result = parseCode(codeEditor.value);
    const errorLines = new Set(result.errors.map(e => e.line));
    updateLineNumbersWithErrors(errorLines);
    if (result.errors.length > 0) {
        errorMsg.textContent = '❌ ' + result.errors.map(e => `行${e.line}: ${e.msg}`).join('; ');
        statusInfo.textContent = '⚠️ 代码有错误，请修正';
        runBtn.disabled = true; stepBtn.disabled = true;
        return result;
    }
    errorMsg.textContent = '';
    const hasMov = result.instructions.some(i => i.type === 'mov');
    const hasContent = result.instructions.some(i => i.type === 'mov' || i.type === 'comment');
    if (hasMov) { statusInfo.textContent = '✅ 代码通过检查'; runBtn.disabled = false; stepBtn.disabled = false; }
    else if (hasContent) { statusInfo.textContent = '💡 代码只有注释，没有 mov 指令'; runBtn.disabled = true; stepBtn.disabled = true; }
    else { statusInfo.textContent = '💡 代码为空'; runBtn.disabled = true; stepBtn.disabled = true; }
    return result;
}
function updateLineNumbers() {
    const lines = codeEditor.value.split('\n');
    let html = '';
    for (let i = 1; i <= lines.length; i++) {
        let cls = '';
        if (state.currentHighlightLine === i) cls = 's1-line-current';
        const line = lines[i - 1] || '';
        if (line.trim().startsWith(';')) cls += ' text-green-600 dark:text-green-400 italic';
        html += `<span class="${cls}">${i}</span>`;
    }
    lineNumbers.innerHTML = html || '<span>1</span>';
}
function updateLineNumbersWithErrors(errorLines) {
    const lines = codeEditor.value.split('\n');
    let html = '';
    for (let i = 1; i <= lines.length; i++) {
        let cls = '';
        if (state.currentHighlightLine === i) cls = 's1-line-current';
        else if (errorLines.has(i)) cls = 's1-line-error';
        const line = lines[i - 1] || '';
        if (line.trim().startsWith(';') && !errorLines.has(i)) cls += ' text-green-600 dark:text-green-400 italic';
        html += `<span class="${cls}">${i}</span>`;
    }
    lineNumbers.innerHTML = html || '<span>1</span>';
}

const TABLE = [[-1, 2, 1], [2, -1, 0], [1, 0, -1]];
function hanoi(sce, des, h) {
    if (sce === des) return [];
    if (h === 1) return [{ from: sce, to: des, disk: 1 }];
    const oth = TABLE[sce][des];
    return [...hanoi(sce, oth, h - 1), { from: sce, to: des, disk: h }, ...hanoi(oth, des, h - 1)];
}
function generateSolverCode(n, from = 0, to = 2) {
    return hanoi(from, to, n).map(m => state.withComments ? `mov ${m.from} ${m.to}  ; 移动圆盘 ${m.disk}` : `mov ${m.from} ${m.to}`);
}
function runSolver() {
    const count = parseInt(diskCountInput.value) || 4;
    if (count < 1 || count > 10) { statusInfo.textContent = '⚠️ 层数请设置在 1~10 之间'; return; }
    const moves = generateSolverCode(count);
    const totalSteps = moves.length;
    const commentStatus = state.withComments ? '含注释' : '无注释';
    codeEditor.value = `; 汉诺塔 ${count} 层 最优解 (${totalSteps} 步) - ${commentStatus}\n; 从柱子 0 移动到柱子 2\n` + moves.join('\n');
    codeEditor.scrollTop = 0;
    const result = runLinter();
    if (result.errors.length === 0) {
        statusInfo.textContent = `🤖 已生成 ${count} 层最优解 (${totalSteps} 步，${commentStatus})`;
        setTimeout(() => { if (state.mode === 'code') executeCode(false); }, 300);
    }
    updateLineNumbers();
}
function toggleComments() {
    state.withComments = !state.withComments;
    updateCommentButton();
    statusInfo.textContent = state.withComments ? '💬 注释已开启' : '🔇 注释已关闭';
}
function updateCommentButton() {
    if (state.withComments) { commentToggle.textContent = '💬 注释'; commentToggle.classList.remove('opacity-60'); }
    else { commentToggle.textContent = '🔇 无注释'; commentToggle.classList.add('opacity-60'); }
}

function executeCode(stepMode = false) {
    if (state.isExecuting || state.isPlaying) return;
    if (state.isComplete) resetGame();
    const result = runLinter();
    if (result.errors.length > 0) return;
    const allInstructions = result.instructions;
    const movs = allInstructions.filter(i => i.type === 'mov');
    if (movs.length === 0) { statusInfo.textContent = '⚠️ 没有可执行的 mov 指令'; return; }
    initRods(parseInt(diskCountInput.value) || 4);
    state.codeQueue = allInstructions;
    state.execIndex = 0;
    state.totalInstructions = allInstructions.length;
    state.isCodeRunning = true;
    state.isExecuting = true;
    state.isPaused = false;
    state.isPlaying = !stepMode;
    state.isComplete = false;
    state.currentHighlightLine = null;
    resetTimer(); startTimer();
    pauseBtn.disabled = false;
    pauseBtn.textContent = '⏸️ 暂停';
    runBtn.disabled = true; stepBtn.disabled = true;
    statusInfo.textContent = stepMode ? '▶ 单步执行...' : '▶ 运行中...';
    if (stepMode) doStepExecution(); else runAllStepsExecution();
}
function doStepExecution() {
    if (!state.isExecuting) return;
    if (state.isPaused) { statusInfo.textContent = '⏸️ 已暂停'; return; }
    if (state.execIndex >= state.totalInstructions) { finishExecution(); return; }
    const instr = state.codeQueue[state.execIndex];
    state.currentHighlightLine = instr.line;
    highlightLine.textContent = instr.line;
    stepCount.textContent = state.execIndex + 1;
    updateLineNumbers();
    if (instr.type === 'mov') {
        if (!isValidMove(instr.from, instr.to)) {
            errorMsg.textContent = `❌ 行${instr.line}: 非法移动 ${instr.from} → ${instr.to}`;
            statusInfo.textContent = '⛔ 执行停止';
            stopExecution(); return;
        }
        doMove(instr.from, instr.to, true);
        let tip = `✅ 执行行 ${instr.line}: mov ${instr.from} ${instr.to}`;
        if (instr.comment && instr.comment.trim() !== '') tip += ` ｜ 注释：${instr.comment.trim().replace(/^;\s*/, '')}`;
        statusInfo.textContent = tip;
        moveCountEl.textContent = state.moveCount;
    } else if (instr.type === 'comment') statusInfo.textContent = `💬 注释行 ${instr.line}: ${instr.content || ''}`;
    else if (instr.type === 'empty') statusInfo.textContent = `📄 空行 ${instr.line}（跳过）`;
    state.execIndex++;
    if (state.rods[2].length === state.diskCount) {
        state.isComplete = true; stopTimer();
        statusInfo.textContent = '🎉 完成! 所有圆盘已移动到目标柱';
        finishExecution(); return;
    }
    render(); updateButtons(); updateLineNumbers();
    state.isPlaying = false;
    runBtn.disabled = false; stepBtn.disabled = false;
    pauseBtn.disabled = true;
    state.isExecuting = false;
    statusInfo.textContent = `⏭ 已执行 ${state.execIndex}/${state.totalInstructions} 步，点击"单步"继续`;
}
function runAllStepsExecution() {
    if (!state.isExecuting) return;
    if (state.isPaused) { statusInfo.textContent = '⏸️ 已暂停'; pauseBtn.textContent = '▶️ 继续'; return; }
    if (state.execIndex >= state.totalInstructions) { finishExecution(); return; }
    const instr = state.codeQueue[state.execIndex];
    state.currentHighlightLine = instr.line;
    highlightLine.textContent = instr.line;
    stepCount.textContent = state.execIndex + 1;
    updateLineNumbers();
    if (instr.type === 'mov') {
        if (!isValidMove(instr.from, instr.to)) {
            errorMsg.textContent = `❌ 行${instr.line}: 非法移动 ${instr.from} → ${instr.to}`;
            statusInfo.textContent = '⛔ 执行停止';
            stopExecution(); return;
        }
        doMove(instr.from, instr.to, true);
        let tip = `✅ 执行行 ${instr.line}: mov ${instr.from} ${instr.to}`;
        if (instr.comment && instr.comment.trim() !== '') tip += ` ｜ 注释：${instr.comment.trim().replace(/^;\s*/, '')}`;
        statusInfo.textContent = tip;
        moveCountEl.textContent = state.moveCount;
    } else if (instr.type === 'comment') statusInfo.textContent = `💬 注释行 ${instr.line}: ${instr.content || ''}`;
    else if (instr.type === 'empty') statusInfo.textContent = `📄 空行 ${instr.line}（跳过）`;
    state.execIndex++;
    if (state.rods[2].length === state.diskCount) {
        state.isComplete = true; stopTimer();
        statusInfo.textContent = '🎉 完成! 所有圆盘已移动到目标柱';
        finishExecution(); return;
    }
    render(); updateButtons(); updateLineNumbers();
    const delay = getSpeedDelay();
    if (state.isPaused) { pauseBtn.textContent = '▶️ 继续'; statusInfo.textContent = '⏸️ 已暂停'; return; }
    setTimeout(() => { if (state.isExecuting && !state.isPaused) runAllStepsExecution(); }, delay);
}
function togglePause() {
    if (!state.isExecuting) return;
    state.isPaused = !state.isPaused;
    if (state.isPaused) { pauseBtn.textContent = '▶️ 继续'; statusInfo.textContent = '⏸️ 已暂停'; }
    else {
        pauseBtn.textContent = '⏸️ 暂停'; statusInfo.textContent = '▶️ 继续执行...';
        if (state.isPlaying) runAllStepsExecution();
        else { state.isExecuting = true; doStepExecution(); }
    }
}
function finishExecution() {
    state.isExecuting = false; state.isPlaying = false; state.isCodeRunning = false; state.isPaused = false;
    pauseBtn.disabled = true; pauseBtn.textContent = '⏸️ 暂停';
    runBtn.disabled = false; stepBtn.disabled = false;
    if (state.isComplete) { statusInfo.textContent = '🎉 恭喜完成!'; highlightLine.textContent = '-'; state.currentHighlightLine = null; updateLineNumbers(); }
    else statusInfo.textContent = `✅ 执行完毕 (${state.execIndex}/${state.totalInstructions} 步)`;
    render(); updateButtons();
}
function stopExecution() {
    state.isExecuting = false; state.isPlaying = false; state.isCodeRunning = false; state.isPaused = false;
    pauseBtn.disabled = true; pauseBtn.textContent = '⏸️ 暂停';
    runBtn.disabled = false; stepBtn.disabled = false;
    render(); updateButtons(); updateLineNumbers();
}

function handleRodClick(rodIndex) {
    if (state.mode !== 'touch' || state.isPlaying || state.animating || state.isExecuting) return;
    if (state.isComplete) { resetGame(); return; }
    if (!state.timerStarted) startTimer();
    if (state.selectedRod === null) {
        if (state.rods[rodIndex].length === 0) { statusInfo.textContent = '⚠️ 这根柱子是空的，请选择有圆盘的柱子'; return; }
        state.selectedRod = rodIndex;
        statusInfo.textContent = `👉 已选择柱子 ${rodIndex}，请选择目标柱子`;
        render(); updateButtons(); return;
    }
    const from = state.selectedRod, to = rodIndex;
    if (from === to) { state.selectedRod = null; statusInfo.textContent = '👆 已取消选择'; render(); updateButtons(); return; }
    if (isValidMove(from, to)) {
        doMove(from, to, true);
        const codeLine = `mov ${from} ${to}  ; 触点手动操作移动`;
        const trimmedLines = codeEditor.value.split('\n').filter(l => l.trim() !== '');
        trimmedLines.push(codeLine);
        codeEditor.value = trimmedLines.join('\n');
        codeEditor.scrollTop = codeEditor.scrollHeight;
        runLinter();
        statusInfo.textContent = `✅ 从 ${from} 移动到 ${to}`;
        state.selectedRod = null;
        render(); updateButtons(); updateLineNumbers();
    } else {
        statusInfo.textContent = `❌ 非法移动: 从 ${from} 到 ${to}`;
        state.selectedRod = null;
        render(); updateButtons();
    }
}

function updateUI() {
    stepCount.textContent = state.currentStep;
    moveCountEl.textContent = state.moveCount;
    if (state.isComplete) statusInfo.textContent = '🎉 恭喜完成!';
    undoBtn.disabled = state.history.length === 0 || state.isPlaying || state.animating || state.isExecuting;
}
function updateButtons() {
    if (state.mode === 'code') {
        const result = runLinter();
        const hasMov = result.instructions.some(i => i.type === 'mov');
        runBtn.disabled = state.isPlaying || state.isComplete || state.isExecuting || !hasMov || result.errors.length > 0;
        stepBtn.disabled = state.isPlaying || state.isComplete || state.isExecuting || !hasMov || result.errors.length > 0;
    } else { runBtn.disabled = true; stepBtn.disabled = true; }
    undoBtn.disabled = state.history.length === 0 || state.isPlaying || state.animating || state.isExecuting;
    solverBtn.disabled = state.isPlaying || state.animating || state.isExecuting;
}
function setMode(mode) {
    if (state.isExecuting || state.isPlaying) return;
    state.mode = mode;
    mainContainer.classList.remove('mode-touch', 'mode-code');
    mainContainer.classList.add(mode === 'touch' ? 'mode-touch' : 'mode-code');
    document.querySelectorAll('.mode-btn').forEach(b => {
        const active = b.dataset.mode === mode;
        b.classList.toggle('bg-primary', active);
        b.classList.toggle('text-white', active);
        b.classList.toggle('text-slate-600', !active);
        b.classList.toggle('dark:text-slate-300', !active);
    });
    if (mode === 'code') {
        statusInfo.textContent = '⌨️ 编程模式 — 编写 mov 指令，点击运行';
        if (codeEditor.value.trim() === '') codeEditor.value = '; 示例: 将3层从0移到2\nmov 0 2  ; 最大圆盘移至目标\nmov 0 1\nmov 2 1\nmov 0 2\nmov 1 0\nmov 1 2\nmov 0 2';
        runLinter();
        state.selectedRod = null;
        render();
    } else {
        statusInfo.textContent = '👆 触点模式 — 点击柱子移动圆盘，自动生成代码';
        runBtn.disabled = true; stepBtn.disabled = true;
        state.selectedRod = null;
        render();
    }
    updateButtons(); updateLineNumbers();
    setTimeout(resizeCanvas, 100);
}

canvas.addEventListener('click', (e) => {
    if (state.mode !== 'touch') return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * canvas.logicalWidth;
    const w = canvas.logicalWidth;
    const rodSpacing = w / 4;
    for (let i = 0; i < 3; i++) {
        const cx = rodSpacing * (i + 1);
        if (Math.abs(x - cx) < 40) { handleRodClick(i); break; }
    }
});
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => { if (state.mode !== btn.dataset.mode) setMode(btn.dataset.mode); });
});
resetBtn.addEventListener('click', resetGame);
undoBtn.addEventListener('click', undoMove);
runBtn.addEventListener('click', () => { if (state.mode === 'code') executeCode(false); });
stepBtn.addEventListener('click', () => {
    if (state.mode === 'code') {
        if (state.isExecuting && !state.isPlaying) { state.isExecuting = true; state.isPaused = false; pauseBtn.disabled = false; doStepExecution(); }
        else executeCode(true);
    }
});
pauseBtn.addEventListener('click', togglePause);
solverBtn.addEventListener('click', runSolver);
commentToggle.addEventListener('click', toggleComments);
formatBtn.addEventListener('click', () => {
    codeEditor.value = codeEditor.value.split('\n').map(l => l.trim()).filter(l => l !== '').join('\n');
    runLinter(); updateLineNumbers();
});
clearBtn.addEventListener('click', () => {
    codeEditor.value = '';
    runLinter(); updateLineNumbers();
    statusInfo.textContent = '🧹 已清空代码';
    errorMsg.textContent = '';
    runBtn.disabled = true; stepBtn.disabled = true;
});
codeEditor.addEventListener('input', () => { runLinter(); updateLineNumbers(); updateButtons(); });
codeEditor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
        e.preventDefault();
        const start = codeEditor.selectionStart, end = codeEditor.selectionEnd;
        codeEditor.value = codeEditor.value.substring(0, start) + '  ' + codeEditor.value.substring(end);
        codeEditor.selectionStart = codeEditor.selectionEnd = start + 2;
        updateLineNumbers();
    }
});
codeEditor.addEventListener('scroll', () => { lineNumbers.scrollTop = codeEditor.scrollTop; });
diskCountInput.addEventListener('change', () => {
    let val = parseInt(diskCountInput.value) || 4;
    if (val < 1) val = 1;
    if (val > 10) val = 10;
    diskCountInput.value = val;
    if (!state.isPlaying && !state.isExecuting) resetGame();
});
window.addEventListener('resize', resizeCanvas);

// 打印按钮
document.getElementById('printHanoiBtn').addEventListener('click', () => {
    document.getElementById('print-hanoi-disks').textContent = state.diskCount;
    document.getElementById('print-hanoi-date').textContent =
        new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    window.print();
});

function initPanelResizer() {
    const leftPanel = document.getElementById('codingPanel');
    panelResizer.addEventListener('mousedown', (e) => {
        isPanelResizing = true;
        resizeStartX = e.clientX;
        resizeStartWidth = leftPanel.offsetWidth;
        document.body.classList.add('resizing');
        function onMouseMove(e) {
            if (!isPanelResizing) return;
            const dx = e.clientX - resizeStartX;
            const newWidth = resizeStartWidth + dx;
            const minW = 220, maxW = mainContainer.offsetWidth - 260;
            if (newWidth >= minW && newWidth <= maxW) leftPanel.style.width = newWidth + 'px';
        }
        function onMouseUp() {
            isPanelResizing = false;
            document.body.classList.remove('resizing');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    });
}

function init() {
    initRods(4);
    codeEditor.value = '; 示例: 将3层从0移到2\nmov 0 2  ; 最大圆盘移至目标\nmov 0 1\nmov 2 1\nmov 0 2\nmov 1 0\nmov 1 2\nmov 0 2';
    resizeCanvas();
    setMode('touch');
    statusInfo.textContent = '👆 触点模式 — 点击柱子移动圆盘';
    runBtn.disabled = true; stepBtn.disabled = true; pauseBtn.disabled = true;
    updateCommentButton();
    updateLineNumbers();
    speedLabel.textContent = SPEED_MAP[3].label;
    initPanelResizer();
}
init();
</script>
