<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>镜面激光迷宫 · 编辑器</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/s1.css">

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#93c5fd',
                        accent: '#1d4ed8',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#94a3b8'
                    },
                    fontFamily: { sans: ['Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        .s1-tool-btn {
            padding: 0.5rem 0.25rem; border-radius: 0.5rem;
            border: 1px solid var(--s1-border);
            background: var(--s1-bg-card); color: var(--s1-text);
            font-size: 0.75rem; font-weight: 500; cursor: pointer;
            transition: all 0.15s; text-align: center;
        }
        .s1-tool-btn:hover { background: var(--s1-neutral); }
        .s1-tool-btn.active {
            border-color: var(--s1-primary);
            background: #eff6ff; color: var(--s1-primary);
        }
        .dark .s1-tool-btn.active { background: rgba(59,130,246,0.15); }
        .s1-color-swatch {
            width: 1.75rem; height: 1.75rem; border-radius: 0.5rem;
            border: 2px solid transparent; cursor: pointer; transition: all 0.15s;
        }
        .s1-color-swatch.active {
            border-color: var(--s1-primary);
            box-shadow: 0 0 0 2px rgba(59,130,246,0.4);
            transform: scale(1.1);
        }
        .s1-legend-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.5rem 0; border-bottom: 1px solid var(--s1-border);
        }
        .s1-legend-item:last-child { border-bottom: none; }
        .s1-legend-icon {
            width: 2rem; height: 2rem; flex-shrink: 0;
            background: var(--s1-neutral); border-radius: 0.5rem;
            border: 1px solid var(--s1-border);
            display: flex; align-items: center; justify-content: center;
            color: var(--s1-text);
        }
        .dark .s1-legend-icon { background: #334155; }
        .s1-legend-text { font-size: 0.75rem; color: var(--s1-text-dim); line-height: 1.3; }
        .s1-legend-text strong { color: var(--s1-text); font-weight: 500; display: block; margin-bottom: 0.125rem; }

        /* ============ 打印样式 ============ */
        @media print {
            .sidebar .s1-card,
            .sidebar .s1-btn,
            .sidebar .s1-no-print,
            .status-bar .s1-btn,
            .s1-no-print,
            #laserTooltip {
                display: none !important;
            }

            html, body {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
                color: #000 !important;
            }

            .sidebar {
                width: auto !important;
                background: #fff !important;
                border: none !important;
                padding: 0 !important;
                display: block !important;
            }

            #app {
                display: block !important;
                width: 100% !important;
                height: auto !important;
            }

            .main-area {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                padding: 0 !important;
                overflow: visible !important;
                background: #fff !important;
            }

            #gameCanvas {
                display: block !important;
                width: 100% !important;
                max-width: 100%;
                height: auto !important;
                background: #fff !important;
                border: 2px solid #000 !important;
                box-shadow: none !important;
                image-rendering: pixelated;
            }

            /* 图例打印 */
            .test-only {
                display: block !important;
                margin-top: 12px !important;
            }

            .test-only .s1-card {
                box-shadow: none !important;
                border: 1px solid #333 !important;
                padding: 8px !important;
                margin-top: 8px !important;
            }

            .s1-legend-item {
                display: inline-flex !important;
                width: 32% !important;
                border: 1px solid #333 !important;
                padding: 4px 8px !important;
                margin: 2px !important;
                background: #fff !important;
                color: #000 !important;
                page-break-inside: avoid;
                vertical-align: top;
            }

            .s1-legend-icon {
                background: #f3f4f6 !important;
                border: 1px solid #666 !important;
                color: #000 !important;
            }

            .s1-legend-text strong { color: #000 !important; }
            .s1-legend-text { color: #333 !important; }

            .status-bar {
                position: static !important;
                margin-top: 8px !important;
                background: #fff !important;
                color: #000 !important;
                border: 1px solid #333 !important;
                padding: 6px 10px !important;
                font-size: 12px !important;
            }

            .win-badge {
                display: inline-block !important;
                background: #fff !important;
                color: #000 !important;
                border: 1px solid #000 !important;
            }

            .s1-print-info {
                display: block !important;
                text-align: center;
                font-size: 12px;
                margin: 8px 0;
                color: #333;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div class="flex w-screen h-screen" id="app">
        <div class="w-64 flex-shrink-0 bg-white dark:bg-slate-800 flex flex-col gap-3 p-4 overflow-y-auto border-r border-slate-200 dark:border-slate-700 shadow-sm sidebar">
            <div class="s1-card">

            <div class="edit-only space-y-3">
                <div class="s1-card">

                    </div>
                    <div class="text-xs text-slate-400 dark:text-slate-500 mt-2 text-center" id="historyInfo">无可撤回操作</div>
                </div>
                <div class="s1-card">
                    <h3 class="s1-title text-sm">地图尺寸</h3>

                <div class="s1-card">
                    <h3 class="s1-title text-sm">颜色</h3>

            <div class="test-only space-y-3" style="display:none;">

                    <div class="s1-legend-item">
                        <div class="s1-legend-icon"><svg width="24" height="24" viewBox="0 0 30 30"><line x1="6" y1="6" x2="24" y2="24" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></div>
                        <div class="s1-legend-text"><strong>双面镜</strong>两面都反射</div>
                    </div>

                        <div class="s1-legend-icon"><svg width="24" height="24" viewBox="0 0 30 30"><line x1="6" y1="6" x2="24" y2="24" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="11" y1="13" x2="9" y2="15" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/><line x1="15" y1="17" x2="13" y2="19" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/><line x1="19" y1="21" x2="17" y2="23" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/></svg></div>
                        <div class="s1-legend-text"><strong>单面镜</strong>光滑面反射，背面阻挡</div>
                    </div>
                    <div class="s1-legend-item">
                        <div class="s1-legend-icon"><svg width="24" height="24" viewBox="0 0 30 30"><polygon points="22,15 8,7 8,23" fill="#ff0000"/></svg></div>
                        <div class="s1-legend-text"><strong>激光</strong>箭头方向 = 发射方向</div>
                    </div>
                    <div class="s1-legend-item">
                        <div class="s1-legend-icon"><svg width="24" height="24" viewBox="0 0 30 30"><circle cx="15" cy="15" r="9" fill="none" stroke="#ffb347" stroke-width="3"/><circle cx="15" cy="15" r="4" fill="#ffb347"/></svg></div>
                        <div class="s1-legend-text"><strong>接收器</strong>激光击中即胜利</div>
                    </div>

                        <div class="s1-legend-icon"><svg width="24" height="24" viewBox="0 0 30 30"><rect x="7" y="7" width="16" height="16" rx="2" fill="#00ffff" opacity="0.5"/></svg></div>
                        <div class="s1-legend-text"><strong>滤镜</strong>输出 = (初始 + 所有滤镜) / (n+1)</div>
                    </div>
                    <div class="text-xs text-slate-400 dark:text-slate-500 mt-3 pt-2 border-t border-slate-200 dark:border-slate-700">点击镜子切换朝向 · 悬浮激光线查看 HEX</div>
                </div>
            </div>
        </div>

        <div class="flex-1 flex items-center justify-center overflow-hidden bg-slate-100 dark:bg-slate-900 p-4 main-area">
            <canvas id="gameCanvas" class="bg-white dark:bg-slate-800 rounded-lg shadow-xl cursor-crosshair"></canvas>
        </div>

    <!-- 打印专用信息 -->
    <div class="s1-print-info hidden">
        镜面激光迷宫 · <span id="print-maze-size"></span> · <span id="print-maze-date"></span>
    </div>

    <div class="fixed bottom-3 left-[268px] right-3 flex justify-between items-center text-sm text-slate-500 dark:text-slate-400 pointer-events-none z-10 status-bar">
        <span id="statusText" class="bg-white dark:bg-slate-800 px-3 py-1 rounded-full shadow-sm pointer-events-auto">编辑模式 · 点击格子放置元素</span>
        <span class="win-badge hidden bg-green-100 dark:bg-green-900/50 text-green-800 dark:text-green-200 px-3 py-1 rounded-full shadow-sm pointer-events-auto" id="winBadge">🎉 命中！</span>
    </div>

    <div class="fixed p-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg shadow-lg text-sm font-mono pointer-events-none z-50 hidden" id="laserTooltip"></div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const winBadge = document.getElementById('winBadge');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const historyInfo = document.getElementById('historyInfo');
    const laserDirPanel = document.getElementById('laserDirPanel');
    const mirrorTypePanel = document.getElementById('mirrorTypePanel');
    const tooltip = document.getElementById('laserTooltip');
    const fileInput = document.getElementById('fileInput');

    let GRID_SIZE = 32;
    let CANVAS_SIZE = 720;
    let CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
    const DIR = { UP: { dx: 0, dy: -1, angle: -Math.PI/2 }, DOWN: { dx: 0, dy: 1, angle: Math.PI/2 }, LEFT: { dx: -1, dy: 0, angle: Math.PI }, RIGHT: { dx: 1, dy: 0, angle: 0 } };
    const DIR_ORDER = ['RIGHT', 'DOWN', 'LEFT', 'UP'];
    const TWO_WAY_ORIENTATIONS = ['slash', 'backslash'];
    const ONE_WAY_ORIENTATIONS = ['LEFT_UP', 'RIGHT_UP', 'RIGHT_DOWN', 'LEFT_DOWN'];
    let mode = 'edit';
    let activeTool = 'laser';
    let activeColor = 'ff0000';
    let activeMirrorKind = 'two-way';
    let activeLaserDir = 'RIGHT';
    let elements = [];
    let laserPaths = [];
    let win = false;
    let hoverRow = -1, hoverCol = -1;

    function resizeCanvas() {
        const sidebarWidth = 256;
        const availW = window.innerWidth - sidebarWidth - 32;
        const availH = window.innerHeight - 32;
        CANVAS_SIZE = Math.min(availW, availH);
        CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        canvas.style.width = CANVAS_SIZE + 'px';
        canvas.style.height = CANVAS_SIZE + 'px';
    }
    window.addEventListener('resize', () => { resizeCanvas(); refresh(); });

    const history = {
        stack: [], pointer: -1, maxSize: 128,
        snapshot() { return JSON.stringify({ gridSize: GRID_SIZE, elements }); },
        push() { this.stack = this.stack.slice(0, this.pointer + 1); this.stack.push(this.snapshot()); if (this.stack.length > this.maxSize) this.stack.shift(); this.pointer = this.stack.length - 1; this.updateUI(); },
        undo() { if (this.pointer > 0) { this.pointer--; const state = JSON.parse(this.stack[this.pointer]); GRID_SIZE = state.gridSize; resizeCanvas(); elements = state.elements; updateSizeButtonsUI(); return true; } return false; },
        redo() { if (this.pointer < this.stack.length - 1) { this.pointer++; const state = JSON.parse(this.stack[this.pointer]); GRID_SIZE = state.gridSize; resizeCanvas(); elements = state.elements; updateSizeButtonsUI(); return true; } return false; },
        clear() { this.stack = []; this.pointer = -1; this.push(); },
        updateUI() { undoBtn.disabled = this.pointer <= 0; redoBtn.disabled = this.pointer >= this.stack.length - 1; const total = this.stack.length; const current = this.pointer + 1; historyInfo.textContent = total <= 1 ? '无可撤回操作' : `第 ${current} / ${total} 步`; }
    };

    function parseHex(hex) { hex = hex.replace('#','').toLowerCase(); return { r: parseInt(hex.substring(0,2), 16), g: parseInt(hex.substring(2,4), 16), b: parseInt(hex.substring(4,6), 16) }; }
    function toHex(r,g,b) { return [r,g,b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2,'0')).join(''); }
    function computeOutputColor(baseColor, filterColors) {
        const n = filterColors.length;
        if (n === 0) return baseColor.toLowerCase().replace('#','');
        const base = parseHex(baseColor);
        let sumR = base.r, sumG = base.g, sumB = base.b;
        for (const fc of filterColors) { const f = parseHex(fc); sumR += f.r; sumG += f.g; sumB += f.b; }
        return toHex(sumR / (n + 1), sumG / (n + 1), sumB / (n + 1));
    }
    function getElementAt(row, col) { return elements.find(e => e.row === row && e.col === col); }
    function removeElementAt(row, col) { elements = elements.filter(e => !(e.row === row && e.col === col)); }

    function interactMirror(mirror, dir) {
        if (mirror.mirrorKind === 'two-way') {
            if (mirror.orientation === 'slash') {
                if (dir === 'RIGHT') return { blocked: false, newDir: 'UP' };
                if (dir === 'UP') return { blocked: false, newDir: 'RIGHT' };
                if (dir === 'LEFT') return { blocked: false, newDir: 'DOWN' };
                if (dir === 'DOWN') return { blocked: false, newDir: 'LEFT' };
            } else {
                if (dir === 'RIGHT') return { blocked: false, newDir: 'DOWN' };
                if (dir === 'DOWN') return { blocked: false, newDir: 'RIGHT' };
                if (dir === 'LEFT') return { blocked: false, newDir: 'UP' };
                if (dir === 'UP') return { blocked: false, newDir: 'LEFT' };
            }
        } else {
            const o = mirror.orientation;
            if (o === 'LEFT_UP') { if (dir === 'RIGHT') return { blocked: false, newDir: 'UP' }; if (dir === 'DOWN') return { blocked: false, newDir: 'LEFT' }; if (dir === 'LEFT') return { blocked: true }; if (dir === 'UP') return { blocked: true }; }
            else if (o === 'LEFT_DOWN') { if (dir === 'RIGHT') return { blocked: false, newDir: 'DOWN' }; if (dir === 'UP') return { blocked: false, newDir: 'LEFT' }; if (dir === 'LEFT') return { blocked: true }; if (dir === 'DOWN') return { blocked: true }; }
            else if (o === 'RIGHT_UP') { if (dir === 'LEFT') return { blocked: false, newDir: 'UP' }; if (dir === 'DOWN') return { blocked: false, newDir: 'RIGHT' }; if (dir === 'RIGHT') return { blocked: true }; if (dir === 'UP') return { blocked: true }; }
            else if (o === 'RIGHT_DOWN') { if (dir === 'LEFT') return { blocked: false, newDir: 'DOWN' }; if (dir === 'UP') return { blocked: false, newDir: 'RIGHT' }; if (dir === 'RIGHT') return { blocked: true }; if (dir === 'DOWN') return { blocked: true }; }
        }
        return { blocked: false, newDir: dir };
    }

    function traceBeam(laser) {
        const path = [];
        const baseColor = (laser.color || 'ff0000').toLowerCase().replace('#','');
        let row = laser.row, col = laser.col, dir = laser.dir || 'RIGHT';
        const filterColors = [];
        const visited = new Set();
        let hitReceiver = false, finalColor = baseColor;
        path.push({ row, col, color: '#' + baseColor });
        let steps = 0;
        const MAX_STEPS = GRID_SIZE * GRID_SIZE * 4;
        while (steps++ < MAX_STEPS) {
            const stateKey = `${row},${col},${dir},${baseColor},${filterColors.join(',')}`;
            if (visited.has(stateKey)) break;
            visited.add(stateKey);
            const delta = DIR[dir];
            const nextRow = row + delta.dy, nextCol = col + delta.dx;
            if (nextRow < 0 || nextRow >= GRID_SIZE || nextCol < 0 || nextCol >= GRID_SIZE) break;
            row = nextRow; col = nextCol;
            const elem = getElementAt(row, col);
            if (elem && elem.type === 'filter') filterColors.push(elem.color || 'ffffff');
            const currentColor = computeOutputColor(baseColor, filterColors);
            finalColor = currentColor;
            path.push({ row, col, color: '#' + currentColor });
            if (elem && elem.type === 'receiver') { hitReceiver = true; break; }
            if (elem && elem.type === 'mirror') { const result = interactMirror(elem, dir); if (result.blocked) break; dir = result.newDir; }
        }
        return { path, hitReceiver, finalColor };
    }

    function computeLaser() {
        laserPaths = []; win = false;
        winBadge.classList.add('hidden');
        const lasers = elements.filter(e => e.type === 'laser');
        if (lasers.length === 0) { statusText.textContent = mode === 'edit' ? '编辑模式 · 请放置激光发射器' : '测试模式 · 请先编辑地图'; return; }
        let anyHit = false, lastFinalColor = null;
        for (const laser of lasers) {
            const result = traceBeam(laser);
            if (result.path.length > 0) laserPaths.push(result.path);
            if (result.hitReceiver) { anyHit = true; lastFinalColor = result.finalColor; }
        }
        if (anyHit) { win = true; winBadge.classList.remove('hidden'); statusText.textContent = `🎉 命中接收器！输出颜色 #${lastFinalColor}`; }
        else statusText.textContent = mode === 'edit' ? `编辑模式 · 激光路径预览` : '测试模式 · 点击镜子切换朝向';
    }

    function drawMirror(cx, cy, mirror) {
        ctx.save(); ctx.translate(cx, cy);
        const half = CELL_SIZE * 0.35;
        let isSlash, backDirX = 0, backDirY = 0;
        if (mirror.mirrorKind === 'two-way') isSlash = mirror.orientation === 'slash';
        else {
            const o = mirror.orientation;
            if (o === 'LEFT_UP') { isSlash = true; backDirX = 1/Math.sqrt(2); backDirY = 1/Math.sqrt(2); }
            else if (o === 'RIGHT_UP') { isSlash = false; backDirX = -1/Math.sqrt(2); backDirY = 1/Math.sqrt(2); }
            else if (o === 'RIGHT_DOWN') { isSlash = true; backDirX = -1/Math.sqrt(2); backDirY = -1/Math.sqrt(2); }
            else { isSlash = false; backDirX = 1/Math.sqrt(2); backDirY = -1/Math.sqrt(2); }
        }
        const isDark = document.documentElement.classList.contains('dark');
        ctx.shadowBlur = 14; ctx.shadowColor = isDark ? '#cce4ff' : '#94a3b8';
        ctx.strokeStyle = isDark ? '#e5f0ff' : '#1e293b';
        ctx.lineWidth = Math.max(3, CELL_SIZE * 0.14); ctx.lineCap = 'round';
        ctx.beginPath();
        if (isSlash) { ctx.moveTo(-half, half); ctx.lineTo(half, -half); }
        else { ctx.moveTo(-half, -half); ctx.lineTo(half, half); }
        ctx.stroke(); ctx.shadowBlur = 0;
        if (mirror.mirrorKind === 'two-way') { ctx.restore(); return; }
        ctx.strokeStyle = isDark ? 'rgba(140,170,210,0.8)' : 'rgba(100,116,139,0.6)';
        ctx.lineWidth = Math.max(1.2, CELL_SIZE * 0.04); ctx.setLineDash([3, 3]);
        const baseOffset = CELL_SIZE * 0.18, lineCount = 3, spacing = CELL_SIZE * 0.05;
        for (let i = 0; i < lineCount; i++) {
            const dist = baseOffset + i * spacing;
            const ox = backDirX * dist, oy = backDirY * dist;
            const t = half * 0.65;
            let dx1, dy1, dx2, dy2;
            if (isSlash) { dx1 = -t/Math.sqrt(2); dy1 = t/Math.sqrt(2); dx2 = t/Math.sqrt(2); dy2 = -t/Math.sqrt(2); }
            else { dx1 = -t/Math.sqrt(2); dy1 = -t/Math.sqrt(2); dx2 = t/Math.sqrt(2); dy2 = t/Math.sqrt(2); }
            ctx.beginPath(); ctx.moveTo(dx1 + ox, dy1 + oy); ctx.lineTo(dx2 + ox, dy2 + oy); ctx.stroke();
        }
        ctx.setLineDash([]); ctx.restore();
    }

    function drawLaser(cx, cy, dir, color, highlight) {
        const angle = DIR[dir].angle; const hex = '#' + color;
        ctx.save(); ctx.translate(cx, cy);
        if (highlight) {
            ctx.shadowBlur = 20; ctx.shadowColor = hex; ctx.strokeStyle = hex; ctx.lineWidth = 2; ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.arc(0, 0, CELL_SIZE * 0.42, 0, 2 * Math.PI); ctx.stroke(); ctx.globalAlpha = 1;
        }
        ctx.rotate(angle); ctx.shadowBlur = 22; ctx.shadowColor = hex; ctx.fillStyle = hex;
        ctx.beginPath(); ctx.moveTo(CELL_SIZE * 0.32, 0); ctx.lineTo(-CELL_SIZE * 0.16, -CELL_SIZE * 0.22); ctx.lineTo(-CELL_SIZE * 0.16, CELL_SIZE * 0.22); ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    function draw() {
        const isDark = document.documentElement.classList.contains('dark');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i <= GRID_SIZE; i++) {
            const pos = i * CELL_SIZE;
            ctx.strokeStyle = isDark ? '#1a2633' : '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, canvas.height); ctx.moveTo(0, pos); ctx.lineTo(canvas.width, pos); ctx.stroke();
        }
        if (mode === 'edit' && hoverRow >= 0 && hoverCol >= 0) {
            const hx = hoverCol * CELL_SIZE, hy = hoverRow * CELL_SIZE;
            const existing = getElementAt(hoverRow, hoverCol);
            ctx.strokeStyle = activeTool === 'erase' ? '#ff6b6b' : '#4a8fe0';
            ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
            ctx.strokeRect(hx + 2, hy + 2, CELL_SIZE - 4, CELL_SIZE - 4); ctx.setLineDash([]);
            if (activeTool === 'laser' && !existing) {
                const cx = hx + CELL_SIZE / 2, cy = hy + CELL_SIZE / 2;
                ctx.save(); ctx.globalAlpha = 0.4; drawLaser(cx, cy, activeLaserDir, activeColor, false); ctx.restore();
            }
        }
        elements.forEach(elem => {
            const x = elem.col * CELL_SIZE, y = elem.row * CELL_SIZE, cx = x + CELL_SIZE / 2, cy = y + CELL_SIZE / 2;
            if (elem.type === 'laser') { const highlight = (mode === 'edit' && activeTool === 'laser'); drawLaser(cx, cy, elem.dir || 'RIGHT', elem.color || 'ff0000', highlight); }
            else if (elem.type === 'mirror') drawMirror(cx, cy, elem);
            else if (elem.type === 'receiver') {
                ctx.shadowBlur = 16; ctx.shadowColor = win ? '#00ff88' : '#ffaa33';
                ctx.strokeStyle = win ? '#6bff8a' : '#ffb347';
                ctx.lineWidth = Math.max(2, CELL_SIZE * 0.08);
                ctx.beginPath(); ctx.arc(cx, cy, CELL_SIZE * 0.28, 0, 2 * Math.PI); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, CELL_SIZE * 0.12, 0, 2 * Math.PI);
                ctx.fillStyle = win ? '#6bff8a' : '#ffb347'; ctx.fill();
            } else if (elem.type === 'filter') {
                const color = '#' + (elem.color || 'ffffff');
                ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = color;
                ctx.fillRect(x + 5, y + 5, CELL_SIZE - 10, CELL_SIZE - 10); ctx.restore();
            }
        });
        laserPaths.forEach(path => {
            if (path.length > 1) {
                for (let i = 0; i < path.length - 1; i++) {
                    const p1 = path[i], p2 = path[i + 1];
                    const x1 = p1.col * CELL_SIZE + CELL_SIZE / 2, y1 = p1.row * CELL_SIZE + CELL_SIZE / 2;
                    const x2 = p2.col * CELL_SIZE + CELL_SIZE / 2, y2 = p2.row * CELL_SIZE + CELL_SIZE / 2;
                    ctx.shadowBlur = 20; ctx.shadowColor = p1.color; ctx.strokeStyle = p1.color;
                    ctx.lineWidth = Math.max(2, CELL_SIZE * 0.13); ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                }
            }
        });
        ctx.shadowBlur = 0;
    }

    function refresh() { computeLaser(); draw(); history.updateUI(); }

    function updateDirPanelUI() {
        document.querySelectorAll('#laserDirPanel .s1-tool-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.dir === activeLaserDir);
        });
    }
    function updateSizeButtonsUI() {
        document.querySelectorAll('.s1-tool-btn[data-size]').forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.dataset.size) === GRID_SIZE);
        });
    }

    function distToSegmentSq(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1, lenSq = dx*dx + dy*dy;
        let t = 0;
        if (lenSq > 0) { t = ((px - x1) * dx + (py - y1) * dy) / lenSq; t = Math.max(0, Math.min(1, t)); }
        const projX = x1 + t * dx, projY = y1 + t * dy;
        const ddx = px - projX, ddy = py - projY;
        return ddx*ddx + ddy*ddy;
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX, my = (e.clientY - rect.top) * scaleY;
        let hoveredColor = null;
        const thresholdSq = 12 * 12;
        for (const path of laserPaths) {
            if (path.length < 2) continue;
            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i], p2 = path[i + 1];
                const x1 = p1.col * CELL_SIZE + CELL_SIZE / 2, y1 = p1.row * CELL_SIZE + CELL_SIZE / 2;
                const x2 = p2.col * CELL_SIZE + CELL_SIZE / 2, y2 = p2.row * CELL_SIZE + CELL_SIZE / 2;
                if (distToSegmentSq(mx, my, x1, y1, x2, y2) <= thresholdSq) { hoveredColor = p1.color; break; }
            }
            if (hoveredColor) break;
        }
        if (hoveredColor) {
            const hex = hoveredColor.replace('#','').toLowerCase();
            tooltip.innerHTML = `<span class="inline-block w-3 h-3 rounded-sm mr-1.5 align-middle" style="background:${hoveredColor};border:1px solid rgba(0,0,0,0.2);"></span>#${hex}`;
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top = (e.clientY - 10) + 'px';
            tooltip.classList.remove('hidden');
        } else tooltip.classList.add('hidden');
        if (mode !== 'edit') { if (hoverRow !== -1 || hoverCol !== -1) { hoverRow = -1; hoverCol = -1; draw(); } return; }
        const col = Math.floor(mx / CELL_SIZE), row = Math.floor(my / CELL_SIZE);
        if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
            if (hoverRow !== row || hoverCol !== col) { hoverRow = row; hoverCol = col; draw(); }
        } else if (hoverRow !== -1) { hoverRow = -1; hoverCol = -1; draw(); }
    });

    canvas.addEventListener('mouseleave', () => { tooltip.classList.add('hidden'); if (hoverRow !== -1 || hoverCol !== -1) { hoverRow = -1; hoverCol = -1; draw(); } });

    document.querySelectorAll('#laserDirPanel .s1-tool-btn').forEach(btn => {
        btn.addEventListener('click', () => { activeLaserDir = btn.dataset.dir; updateDirPanelUI(); draw(); });
    });

    function handleCanvasClick(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX, my = (e.clientY - rect.top) * scaleY;
        const col = Math.floor(mx / CELL_SIZE), row = Math.floor(my / CELL_SIZE);
        if (row < 0 || row >= GRID_SIZE || col < 0 || col >= GRID_SIZE) return;
        if (mode === 'test') {
            const elem = getElementAt(row, col);
            if (elem && elem.type === 'mirror') {
                if (elem.mirrorKind === 'two-way') { const idx = TWO_WAY_ORIENTATIONS.indexOf(elem.orientation); elem.orientation = TWO_WAY_ORIENTATIONS[(idx + 1) % TWO_WAY_ORIENTATIONS.length]; }
                else { const idx = ONE_WAY_ORIENTATIONS.indexOf(elem.orientation); elem.orientation = ONE_WAY_ORIENTATIONS[(idx + 1) % ONE_WAY_ORIENTATIONS.length]; }
                history.push(); refresh();
            }
            return;
        }
        if (e.shiftKey) {
            const elem = getElementAt(row, col);
            if (elem && (elem.type === 'laser' || elem.type === 'filter')) { elem.color = activeColor; history.push(); refresh(); return; }
        }
        if (activeTool === 'erase') { const existing = getElementAt(row, col); if (existing) { removeElementAt(row, col); history.push(); refresh(); } return; }
        const existing = getElementAt(row, col);
        let changed = false;
        if (activeTool === 'laser') {
            if (existing && existing.type === 'laser') { const currentIdx = DIR_ORDER.indexOf(existing.dir || 'RIGHT'); const nextIdx = (currentIdx + 1) % DIR_ORDER.length; existing.dir = DIR_ORDER[nextIdx]; changed = true; }
            else { removeElementAt(row, col); elements.push({ type:'laser', row, col, dir: activeLaserDir, color: activeColor }); changed = true; }
        } else if (activeTool === 'mirror') {
            if (existing && existing.type === 'mirror') {
                if (existing.mirrorKind === 'two-way') { const idx = TWO_WAY_ORIENTATIONS.indexOf(existing.orientation); existing.orientation = TWO_WAY_ORIENTATIONS[(idx + 1) % TWO_WAY_ORIENTATIONS.length]; }
                else { const idx = ONE_WAY_ORIENTATIONS.indexOf(existing.orientation); existing.orientation = ONE_WAY_ORIENTATIONS[(idx + 1) % ONE_WAY_ORIENTATIONS.length]; }
                changed = true;
            } else { removeElementAt(row, col); elements.push({ type:'mirror', row, col, mirrorKind: activeMirrorKind === 'two-way' ? 'two-way' : 'one-way', orientation: activeMirrorKind === 'two-way' ? 'slash' : 'LEFT_UP' }); changed = true; }
        } else if (activeTool === 'receiver') { removeElementAt(row, col); elements.push({ type:'receiver', row, col }); changed = true; }
        else if (activeTool === 'filter') { removeElementAt(row, col); elements.push({ type:'filter', row, col, color: activeColor }); changed = true; }
        if (changed) { history.push(); refresh(); }
    }

    function setMode(newMode) {
        mode = newMode;
        document.getElementById('modeEdit').className = mode === 'edit' ? 'flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-primary text-white transition-colors' : 'flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 transition-colors';
        document.getElementById('modeTest').className = mode === 'test' ? 'flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-primary text-white transition-colors' : 'flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-slate-200 text-slate-600 hover:bg-slate-300 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 transition-colors';
        document.querySelector('.edit-only').style.display = mode === 'edit' ? 'block' : 'none';
        document.querySelector('.test-only').style.display = mode === 'test' ? 'block' : 'none';
        canvas.style.cursor = mode === 'edit' ? 'crosshair' : 'pointer';
        hoverRow = -1; hoverCol = -1; tooltip.classList.add('hidden');
        refresh();
    }
    document.getElementById('modeEdit').addEventListener('click', () => setMode('edit'));
    document.getElementById('modeTest').addEventListener('click', () => setMode('test'));

    document.querySelectorAll('.s1-tool-btn[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.s1-tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeTool = btn.dataset.tool;
            const hints = {
                laser: '点击放置激光，再点旋转方向。Shift+点击改颜色',
                mirror: '点击放置镜子，再点切换朝向',
                receiver: '点击格子放置接收器',
                filter: '点击格子放置滤镜（Shift+点击改色）',
                erase: '点击格子删除元素'
            };
            document.getElementById('toolHint').textContent = hints[activeTool] || '';
            laserDirPanel.style.display = activeTool === 'laser' ? 'flex' : 'none';
            mirrorTypePanel.style.display = activeTool === 'mirror' ? 'block' : 'none';
            draw();
        });
    });

    document.querySelectorAll('.s1-tool-btn[data-size]').forEach(btn => {
        btn.addEventListener('click', () => {
            const newSize = parseInt(btn.dataset.size);
            if (newSize === GRID_SIZE) return;
            if (!confirm(`切换到 ${newSize} × ${newSize} 会清空当前地图，确定吗？`)) return;
            GRID_SIZE = newSize;
            resizeCanvas();
            elements = [];
            updateSizeButtonsUI();
            history.push();
            refresh();
        });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        if (elements.length === 0) { statusText.textContent = '地图已经是空的'; return; }
        if (!confirm('确定要清空当前地图吗？')) return;
        elements = [];
        history.push();
        refresh();
    });

    document.querySelectorAll('.s1-color-swatch').forEach(sw => {
        sw.addEventListener('click', () => {
            document.querySelectorAll('.s1-color-swatch').forEach(s => s.classList.remove('active'));
            sw.classList.add('active');
            activeColor = sw.dataset.color;
        });
    });

    document.querySelectorAll('.s1-tool-btn[data-mirror-kind]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.s1-tool-btn[data-mirror-kind]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeMirrorKind = btn.dataset.mirrorKind;
        });
    });

    undoBtn.addEventListener('click', () => { if (history.undo()) refresh(); });
    redoBtn.addEventListener('click', () => { if (history.redo()) refresh(); });

    document.addEventListener('keydown', (e) => {
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); if (history.undo()) refresh(); }
        else if (ctrl && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); if (history.redo()) refresh(); }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        const data = {
            version: 13, gridSize: GRID_SIZE,
            elements: elements.map(e => ({ type: e.type, row: e.row, col: e.col, dir: e.dir, color: e.color, mirrorKind: e.mirrorKind, orientation: e.orientation }))
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `maze-${GRID_SIZE}x${GRID_SIZE}.ls-map`;
        a.click();
        URL.revokeObjectURL(url);
    });

    document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.elements) {
                    if (data.gridSize && data.gridSize >= 4 && data.gridSize <= 32) { GRID_SIZE = data.gridSize; resizeCanvas(); }
                    elements = data.elements.map(e => {
                        if (e.type === 'mirror' && !e.mirrorKind) return { type: 'mirror', row: e.row, col: e.col, mirrorKind: 'two-way', orientation: 'slash' };
                        return { ...e };
                    });
                    updateSizeButtonsUI();
                    history.push();
                    refresh();
                    statusText.textContent = '地图已导入';
                }
            } catch (err) { alert('导入失败：文件格式错误'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    canvas.addEventListener('click', handleCanvasClick);

    // 打印：编辑模式下先切到测试模式以显示图例
    document.getElementById('printMazeBtn').addEventListener('click', () => {
        document.getElementById('print-maze-size').textContent = `${GRID_SIZE} × ${GRID_SIZE}`;
        document.getElementById('print-maze-date').textContent =
            new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

        const wasEdit = mode === 'edit';
        if (wasEdit) setMode('test');

        window.print();

        const restore = () => {
            if (wasEdit) setMode('edit');
            window.removeEventListener('afterprint', restore);
        };
        window.addEventListener('afterprint', restore);
        setTimeout(() => { if (wasEdit) setMode('edit'); }, 1000);
    });

    elements = [
        { type:'laser', row: 16, col: 0, dir:'RIGHT', color:'ff0000' },
        { type:'mirror', row: 16, col: 6, mirrorKind:'two-way', orientation:'slash' },
        { type:'mirror', row: 6, col: 6, mirrorKind:'two-way', orientation:'backslash' },
        { type:'mirror', row: 6, col: 16, mirrorKind:'two-way', orientation:'slash' },
        { type:'mirror', row: 16, col: 16, mirrorKind:'two-way', orientation:'backslash' },
        { type:'filter', row: 16, col: 22, color:'00ffff' },
        { type:'receiver', row: 16, col: 31 }
    ];

    updateSizeButtonsUI();
    updateDirPanelUI();
    resizeCanvas();
    history.clear();
    refresh();
})();
</script>
</body>
</html>
