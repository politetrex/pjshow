<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图案生成器 - 图片转Excel拼豆</title>

    <link rel="icon" href="../src/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../src/favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <link rel="stylesheet" href="../src/css/s1.css">

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#93c5fd',
                        accent: '#1d4ed8',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#94a3b8'
                    },
                    fontFamily: { sans: ['Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .bead-preview { image-rendering: pixelated; image-rendering: crisp-edges; }
        .s1-dropzone {
            border: 2px dashed var(--s1-primary);
            transition: all 0.3s ease;
            border-radius: 0.75rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
        }
        .s1-dropzone.active {
            border-color: #22c55e;
            background-color: rgba(34,197,94,0.1);
        }
        .s1-range {
            -webkit-appearance: none; height: 8px; border-radius: 4px;
            background: var(--s1-border); outline: none; width: 100%;
        }
        .s1-range::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px;
            border-radius: 50%; background: var(--s1-primary);
            cursor: pointer; transition: all 0.2s ease;
        }
        .s1-range::-webkit-slider-thumb:hover {
            background: var(--s1-accent);
            transform: scale(1.1);
        }
        .s1-loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid var(--s1-primary);
            width: 24px; height: 24px;
            animation: s1-spin 1s linear infinite;
        }
        @keyframes s1-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ============ 打印样式 ============ */
        @media print {
            /* 隐藏所有交互控件 */
            header .s1-btn,
            #dropzone,
            #widthSlider,
            #heightSlider,
            #generateBtn,
            #downloadBtn,
            #printBeadBtn,
            #downloadSection,
            #downloadStatus,
            #colorLegend,
            .s1-no-print,
            #loadingOverlay {
                display: none !important;
            }

            /* 隐藏左侧图片设置整块 */
            .s1-print-hide-settings {
                display: none !important;
            }

            body {
                background: #ffffff !important;
                color: #000 !important;
            }

            .s1-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }

            /* 打印专用信息 */
            .s1-print-info {
                display: block !important;
                text-align: center;
                margin-bottom: 12px;
                font-size: 12px;
                color: #333;
            }

            /* 预览区 */
            #previewContainer {
                margin: 0 !important;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #previewPlaceholder { display: none !important; }
            #imagePreview { display: none !important; }
            #beadPreview {
                display: block !important;
                width: 100% !important;
                max-width: 100%;
                height: auto !important;
                image-rendering: pixelated;
                border: 1px solid #333;
            }
            canvas { background: #fff !important; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-900 dark:to-slate-800">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-primary mb-2">拼豆图案生成器</h1>
            <p class="text-lg text-slate-600 dark:text-slate-400">
                <img src="../src/favicon.png" class="inline w-5 h-auto"> 林耀附属网站应用
            </p>
            <p class="text-lg text-slate-600 dark:text-slate-400">上传图片，设置尺寸，一键生成Excel拼豆模板</p>

            <!-- 打印专用信息 -->
            <div class="s1-print-info hidden">
                <div>拼豆图案 · <span id="print-bead-size"></span> · <span id="print-bead-date"></span></div>
            </div>

            <div class="flex justify-center mt-4">
                <button id="themeToggle" class="s1-btn s1-btn-secondary text-sm px-3 py-1.5 s1-no-print" title="切换明暗模式">
                    <i id="themeIcon" class="fa fa-moon-o"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="s1-card s1-print-hide-settings">
                <h2 class="s1-title">
                    <i class="fa fa-sliders text-primary"></i>
                    图片设置
                </h2>
                <div class="mb-8">
                    <label class="block text-slate-700 dark:text-slate-300 font-medium mb-2">上传图片</label>
                    <div id="dropzone" class="s1-dropzone">
                        <input type="file" id="imageInput" accept="image/*" class="hidden">
                        <i class="fa fa-cloud-upload text-4xl text-primary mb-3"></i>
                        <p class="text-slate-600 dark:text-slate-400 mb-2">点击或拖拽图片到此处</p>
                        <p class="text-sm text-slate-500 dark:text-slate-500">支持 JPG、PNG、GIF 格式</p>
                    </div>
                </div>
                <div class="mb-8">
                    <label class="block text-slate-700 dark:text-slate-300 font-medium mb-4">设置拼豆尺寸</label>
                    <div class="mb-4">
                        <div class="flex justify-between mb-1">
                            <label class="text-sm text-slate-600 dark:text-slate-400">宽度 (单元格)</label>
                            <span id="widthValue" class="text-sm font-medium text-primary">20</span>
                        </div>
                        <input type="range" id="widthSlider" min="5" max="100" value="20" class="s1-range">
                    </div>
                    <div class="mb-4">
                        <div class="flex justify-between mb-1">
                            <label class="text-sm text-slate-600 dark:text-slate-400">高度 (单元格)</label>
                            <span id="heightValue" class="text-sm font-medium text-primary">20</span>
                        </div>
                        <input type="range" id="heightSlider" min="5" max="100" value="20" class="s1-range">
                    </div>
                    <div class="mt-2 text-xs text-blue-600 dark:text-blue-400">
                        <p>💡 提示：支持最大100x100的拼豆尺寸，超过50x50时会有性能提示</p>
                    </div>
                </div>
                <div class="mb-8">
                    <label class="block text-slate-700 dark:text-slate-300 font-medium mb-2">颜色设置</label>
                    <div class="p-3 bg-blue-50 dark:bg-blue-900/30 rounded-lg">
                        <p class="text-sm text-slate-700 dark:text-slate-300">
                            <i class="fa fa-info-circle text-blue-500 mr-1"></i>
                            系统将使用图片中的原始颜色。Excel文件将包含颜色代码。
                        </p>
                    </div>
                </div>
                <button id="generateBtn" class="s1-btn s1-btn-primary w-full py-3">
                    <i class="fa fa-magic mr-2"></i>
                    生成拼豆模板
                </button>
                <button id="printBeadBtn" class="s1-btn s1-btn-secondary w-full py-3 mt-3 s1-no-print">
                    <i class="fa fa-print mr-2"></i>
                    打印拼豆表格
                </button>
            </div>

            <div class="s1-card">
                <h2 class="s1-title">
                    <i class="fa fa-eye text-primary"></i>
                    预览效果
                </h2>
                <div id="previewContainer" class="relative mb-6">
                    <div id="previewPlaceholder" class="flex flex-col items-center justify-center h-64 bg-slate-100 dark:bg-slate-700 rounded-lg">
                        <i class="fa fa-image text-4xl text-slate-400 mb-3"></i>
                        <p class="text-slate-500">上传图片后在此处预览</p>
                    </div>
                    <canvas id="imagePreview" class="bead-preview w-full h-auto rounded-lg hidden"></canvas>
                    <canvas id="beadPreview" class="bead-preview w-full h-auto rounded-lg hidden"></canvas>
                </div>
                <div id="colorLegend" class="mb-6 hidden">
                    <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-300 mb-3">颜色图例</h3>
                    <div class="flex flex-wrap gap-2" id="legendContainer"></div>
                </div>
                <div id="downloadSection" class="hidden">
                    <button id="downloadBtn" class="s1-btn s1-btn-success w-full py-3">
                        <i class="fa fa-download mr-2"></i>
                        下载Excel模板
                    </button>
                    <div id="downloadStatus" class="hidden mt-2"></div>
                </div>
            </div>
        </div>

        <footer class="mt-8"></footer>
        <script src="../src/js/copyright-parse.js" type="module"></script>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-lg flex flex-col items-center">
            <div class="s1-loading-spinner mb-4"></div>
            <p id="loadingText" class="text-slate-700 dark:text-slate-300">正在处理图片...</p>
        </div>
    </div>

<script>
let originalImage = null;
let beadColors = [];

const BEAD_COLOR_PALETTE = [
    { name: "黑色", rgb: [0, 0, 0] },
    { name: "深灰", rgb: [100, 100, 100] },
    { name: "中灰", rgb: [169, 169, 169] },
    { name: "浅灰", rgb: [211, 211, 211] },
    { name: "白色", rgb: [255, 255, 255] },
    { name: "粉红", rgb: [255, 192, 203] },
    { name: "红色", rgb: [255, 0, 0] },
    { name: "深红", rgb: [139, 0, 0] },
    { name: "橙色", rgb: [255, 165, 0] },
    { name: "浅橙", rgb: [255, 215, 0] },
    { name: "黄色", rgb: [255, 255, 0] },
    { name: "浅绿", rgb: [144, 238, 144] },
    { name: "绿色", rgb: [0, 128, 0] },
    { name: "深绿", rgb: [0, 100, 0] },
    { name: "浅蓝", rgb: [173, 216, 230] },
    { name: "蓝色", rgb: [0, 0, 255] },
    { name: "深蓝", rgb: [0, 0, 139] },
    { name: "紫色", rgb: [128, 0, 128] },
    { name: "深紫", rgb: [75, 0, 130] },
    { name: "粉色", rgb: [255, 105, 180] },
    { name: "棕色", rgb: [165, 42, 42] },
    { name: "深棕", rgb: [139, 69, 19] },
    { name: "肤色", rgb: [255, 222, 173] },
    { name: "米色", rgb: [245, 245, 220] }
];

const imageInput = document.getElementById('imageInput');
const dropzone = document.getElementById('dropzone');
const widthSlider = document.getElementById('widthSlider');
const heightSlider = document.getElementById('heightSlider');
const widthValue = document.getElementById('widthValue');
const heightValue = document.getElementById('heightValue');
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
const previewPlaceholder = document.getElementById('previewPlaceholder');
const imagePreview = document.getElementById('imagePreview');
const beadPreview = document.getElementById('beadPreview');
const colorLegend = document.getElementById('colorLegend');
const legendContainer = document.getElementById('legendContainer');
const downloadSection = document.getElementById('downloadSection');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');

function initThemeIcon() {
    const isDark = document.documentElement.classList.contains('dark');
    themeIcon.className = isDark ? 'fa fa-sun-o' : 'fa fa-moon-o';
}
themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeIcon();
});
initThemeIcon();

function init() {
    imageInput.addEventListener('change', handleImageUpload);
    dropzone.addEventListener('click', () => imageInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('active'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('active'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('active');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            imageInput.files = e.dataTransfer.files;
            handleImageUpload(e);
        }
    });
    widthSlider.addEventListener('input', () => { widthValue.textContent = widthSlider.value; if (originalImage) updatePreviews(); });
    heightSlider.addEventListener('input', () => { heightValue.textContent = heightSlider.value; if (originalImage) updatePreviews(); });
    generateBtn.addEventListener('click', generateBeadPattern);
    downloadBtn.addEventListener('click', downloadExcel);
    // 打印绑定
    document.getElementById('printBeadBtn').addEventListener('click', () => {
        if (!originalImage) { alert('请先上传图片并生成拼豆模板'); return; }
        document.getElementById('print-bead-size').textContent = `${widthSlider.value} × ${heightSlider.value}`;
        document.getElementById('print-bead-date').textContent =
            new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
        window.print();
    });
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        originalImage = new Image();
        originalImage.onload = () => {
            showLoading("正在处理图片...");
            setTimeout(() => { updatePreviews(); hideLoading(); }, 500);
        };
        originalImage.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function updatePreviews() {
    if (!originalImage) return;
    const width = parseInt(widthSlider.value);
    const height = parseInt(heightSlider.value);
    previewPlaceholder.classList.add('hidden');
    imagePreview.classList.remove('hidden');
    beadPreview.classList.remove('hidden');
    const imageCtx = imagePreview.getContext('2d');
    imagePreview.width = width * 10;
    imagePreview.height = height * 10;
    imageCtx.drawImage(originalImage, 0, 0, imagePreview.width, imagePreview.height);
    generateBeadPreview();
}

function generateBeadPreview() {
    try {
        const width = parseInt(widthSlider.value);
        const height = parseInt(heightSlider.value);
        const maxSize = 50;
        let displayWidth = width, displayHeight = height;
        if (width > maxSize || height > maxSize) {
            const scale = maxSize / Math.max(width, height);
            displayWidth = Math.floor(width * scale);
            displayHeight = Math.floor(height * scale);
        }
        const beadCtx = beadPreview.getContext('2d');
        beadPreview.width = displayWidth * 8;
        beadPreview.height = displayHeight * 8;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = width;
        tempCanvas.height = height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(originalImage, 0, 0, width, height);
        const imageData = tempCtx.getImageData(0, 0, width, height);
        const data = imageData.data;
        beadColors = [];
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const nearestColor = findNearestBeadColor({r, g, b});
            beadColors.push({ r: nearestColor.rgb[0], g: nearestColor.rgb[1], b: nearestColor.rgb[2], name: nearestColor.name });
        }
        updateColorLegend(beadColors);
        colorLegend.classList.remove('hidden');
        const beadSize = 8;
        for (let y = 0; y < displayHeight; y++) {
            for (let x = 0; x < displayWidth; x++) {
                const originalX = Math.floor(x * (width / displayWidth));
                const originalY = Math.floor(y * (height / displayHeight));
                const index = originalY * width + originalX;
                const color = beadColors[index];
                if (color) {
                    beadCtx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
                    beadCtx.fillRect(x * beadSize, y * beadSize, beadSize - 1, beadSize - 1);
                }
            }
        }
    } catch (error) {
        console.error('生成预览时出错:', error);
        alert('生成预览时出错，请重试。');
    }
}

function getColorDistance(color1, color2) {
    const dr = color1.r - color2.r, dg = color1.g - color2.g, db = color1.b - color2.b;
    return Math.sqrt(dr * dr + dg * dg + db * db);
}

function findNearestBeadColor(color) {
    if (!color || typeof color.r !== 'number' || typeof color.g !== 'number' || typeof color.b !== 'number') {
        return BEAD_COLOR_PALETTE[4];
    }
    const r = Math.max(0, Math.min(255, color.r));
    const g = Math.max(0, Math.min(255, color.g));
    const b = Math.max(0, Math.min(255, color.b));
    let minDistance = Infinity, nearestColor = BEAD_COLOR_PALETTE[4];
    for (const beadColor of BEAD_COLOR_PALETTE) {
        const distance = getColorDistance({ r, g, b }, { r: beadColor.rgb[0], g: beadColor.rgb[1], b: beadColor.rgb[2] });
        if (distance < minDistance) { minDistance = distance; nearestColor = beadColor; }
    }
    return nearestColor;
}

function updateColorLegend(colors) {
    legendContainer.innerHTML = '';
    const uniqueColors = [];
    const colorMap = new Map();
    for (const color of colors) {
        const key = `${color.r},${color.g},${color.b}`;
        if (!colorMap.has(key)) { colorMap.set(key, color); uniqueColors.push(color); }
    }
    for (const color of uniqueColors) {
        const legendItem = document.createElement('div');
        legendItem.className = 'flex items-center';
        const colorBox = document.createElement('div');
        colorBox.className = 'w-4 h-4 rounded-full mr-1 border border-gray-300';
        colorBox.style.backgroundColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
        const colorName = document.createElement('span');
        colorName.className = 'text-xs text-slate-700 dark:text-slate-300';
        colorName.textContent = color.name || '';
        legendItem.appendChild(colorBox);
        legendItem.appendChild(colorName);
        legendContainer.appendChild(legendItem);
    }
}

function generateBeadPattern() {
    if (!originalImage) { alert('请先上传图片！'); return; }
    showLoading("正在生成拼豆模板...");
    try {
        generateBeadPreview();
        downloadSection.classList.remove('hidden');
        const downloadStatus = document.getElementById('downloadStatus');
        downloadStatus.textContent = '预览生成成功！点击下载按钮导出Excel文件。';
        downloadStatus.className = 'mt-1 text-green-600';
        downloadStatus.classList.remove('hidden');
    } catch (error) {
        console.error("生成预览时出错:", error);
        alert("生成预览时出错：" + error.message);
    } finally { hideLoading(); }
}

function downloadExcel() {
    try {
        const downloadStatus = document.getElementById('downloadStatus');
        downloadStatus.textContent = '正在准备导出...';
        downloadStatus.className = 'mt-1 text-blue-600';
        downloadStatus.classList.remove('hidden');
        if (beadColors.length === 0) {
            alert('没有颜色数据！请先生成拼豆模板。');
            downloadStatus.textContent = '导出失败：没有颜色数据';
            downloadStatus.className = 'mt-1 text-red-600';
            return;
        }
        const width = parseInt(widthSlider.value);
        const height = parseInt(heightSlider.value);
        const exportWidth = width, exportHeight = height;
        if (width > 50 || height > 50) {
            const totalCells = width * height;
            if (totalCells > 2000) {
                if (!confirm(`警告：图片尺寸较大（${width}x${height}，共${totalCells}个单元格），可能导致Excel文件生成缓慢。是否继续？`)) {
                    downloadStatus.textContent = '导出已取消';
                    downloadStatus.className = 'mt-1 text-gray-600';
                    return;
                }
            }
        }
        downloadStatus.textContent = '正在创建数据...';
        const data = [];
        for (let y = 0; y < exportHeight; y++) {
            const row = [];
            for (let x = 0; x < exportWidth; x++) {
                const index = y * width + x;
                if (index < beadColors.length) {
                    const color = beadColors[index];
                    const hexColor = rgbToHex(color.r, color.g, color.b);
                    row.push({
                        v: '', t: 's',
                        s: {
                            fill: { patternType: 'solid', fgColor: { rgb: hexColor } },
                            border: {
                                top: { style: 'thin', color: { rgb: 'CCCCCC' } },
                                bottom: { style: 'thin', color: { rgb: 'CCCCCC' } },
                                left: { style: 'thin', color: { rgb: 'CCCCCC' } },
                                right: { style: 'thin', color: { rgb: 'CCCCCC' } }
                            }
                        }
                    });
                } else {
                    row.push({ v: '', t: 's', s: { fill: { patternType: 'solid', fgColor: { rgb: 'FFFFFF' } } } });
                }
            }
            data.push(row);
        }
        downloadStatus.textContent = '正在生成Excel文件...';
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = Array(exportWidth + 1).fill({wch: 3});
        ws['!rows'] = [];
        for (let i = 0; i < exportHeight; i++) ws['!rows'].push({ hpx: 15 });
        const range = { s: { r: 0, c: 0 }, e: { r: exportHeight - 1, c: exportWidth - 1 } };
        for (let c = range.s.c; c <= range.e.c; c++) {
            const topCell = ws[XLSX.utils.encode_cell({ r: range.s.r, c })];
            if (topCell && topCell.s) topCell.s.border.top = { style: 'medium', color: { rgb: '000000' } };
            const bottomCell = ws[XLSX.utils.encode_cell({ r: range.e.r, c })];
            if (bottomCell && bottomCell.s) bottomCell.s.border.bottom = { style: 'medium', color: { rgb: '000000' } };
        }
        for (let r = range.s.r; r <= range.e.r; r++) {
            const leftCell = ws[XLSX.utils.encode_cell({ r, c: range.s.c })];
            if (leftCell && leftCell.s) leftCell.s.border.left = { style: 'medium', color: { rgb: '000000' } };
            const rightCell = ws[XLSX.utils.encode_cell({ r, c: range.e.c })];
            if (rightCell && rightCell.s) rightCell.s.border.right = { style: 'medium', color: { rgb: '000000' } };
        }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "拼豆图案");
        const fileName = "拼豆图案生成器_" + new Date().toISOString().slice(0, 10) + ".xlsx";
        try {
            XLSX.writeFile(wb, fileName);
            downloadStatus.textContent = '🎉 文件已成功生成！Excel单元格已自动设置背景色！';
            downloadStatus.className = 'mt-1 text-green-600 font-bold';
        } catch (fileError) {
            console.error('写入文件时出错:', fileError);
            downloadStatus.textContent = '文件保存失败：' + fileError.message;
            downloadStatus.className = 'mt-1 text-red-600';
        }
    } catch (error) {
        console.error('生成Excel文件时出错:', error);
        const downloadStatus = document.getElementById('downloadStatus');
        downloadStatus.textContent = '生成失败：' + error.message;
        downloadStatus.className = 'mt-1 text-red-600';
    } finally {
        setTimeout(() => {
            const downloadStatus = document.getElementById('downloadStatus');
            if (downloadStatus) downloadStatus.classList.add('hidden');
        }, 5000);
    }
}

function rgbToHex(r, g, b) {
    if (typeof r !== 'number' || typeof g !== 'number' || typeof b !== 'number') return 'FFFFFF';
    r = Math.round(Math.max(0, Math.min(255, r)));
    g = Math.round(Math.max(0, Math.min(255, g)));
    b = Math.round(Math.max(0, Math.min(255, b)));
    const hexColor = r.toString(16).toUpperCase().padStart(2, '0') + g.toString(16).toUpperCase().padStart(2, '0') + b.toString(16).toUpperCase().padStart(2, '0');
    if (hexColor.length !== 6 || !/^[0-9A-F]{6}$/.test(hexColor)) return 'FFFFFF';
    return hexColor;
}

function showLoading(text) { loadingText.textContent = text || "处理中..."; loadingOverlay.classList.remove('hidden'); }
function hideLoading() { loadingOverlay.classList.add('hidden'); }

document.addEventListener('DOMContentLoaded', init);
</script>
